<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Вход — Мой тренер</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.4 -apple-system,system-ui,sans-serif;background:#F2F3F7;color:#111}
@media (prefers-color-scheme:dark){body{background:#0B0B0D;color:#F5F5F7}}a{color:#047857}</style></head>
<body><p id="m">Входим в «Мой тренер»…</p>
<script>
// Ответ Яндекс ID (implicit flow, токен в #hash): кладём в память и возвращаемся в приложение — оно само закончит вход.
(function(){var r={kind:'yandex',at:Date.now()},p=[new URLSearchParams(location.search),new URLSearchParams(location.hash.slice(1))];
p.forEach(function(u){u.forEach(function(v,k){if(['access_token','code','state','device_id','payload','error','error_description'].indexOf(k)>=0)r[k]=v})});
var back='/';try{localStorage.setItem('mt-oauth',JSON.stringify(r));var g=JSON.parse(localStorage.getItem('mt-oauth-go')||'{}');if(g.back&&g.back.indexOf(location.origin+'/')===0)back=g.back}catch(e){document.getElementById('m').innerHTML='Не получилось войти. <a href="/">Вернуться в приложение</a>';return}
history.replaceState(null,'',location.pathname);location.replace(back)})();
</script></body></html>
