  return SYN.some(([w, re]) => (q.startsWith(w) || (q.length >= 3 && w.startsWith(q))) && new RegExp(re).test(nrm(v.ru)));
}
function renderAtlas() { // роговица, склера и т. п. лежат в слое мышц модели — в список не берём, касанием открываются
  const q = nrm($('#aq').value.trim()), by = {}; let n = 0;
  for (const [k, v] of Object.entries(RU)) { if (v.l !== 'muscles' || !v.g || !/мышц/i.test(v.k)) continue; if (q && !matchQ(k, v, q)) continue; (by[v.g] = by[v.g] || []).push([k, v]); n++ }
  const hl = x => { const t = H(x); if (!q) return t; const i = nrm(x).indexOf(q); return i < 0 ? t : H(x.slice(0, i)) + '<mark>' + H(x.slice(i, i + q.length)) + '</mark>' + H(x.slice(i + q.length)) };
  $('#alst').innerHTML = n ? Object.keys(GN).filter(g => by[g]).map(g => `<div class="sh" id="ag-${g}"><span>${GN[g]} · ${by[g].length}</span><button data-g="${g}">Показать группу</button></div>`
    + by[g].sort((a, b) => a[1].ru.localeCompare(b[1].ru, 'ru')).map(([k, v]) => `<button class="it" data-k="${H(k)}"><div class="tx"><b>${hl(v.ru)}</b><small>${H(v.la)}</small></div><span class="go">›</span></button>`).join('')).join('')
    : '<div class="no">Ничего не нашли. Попробуйте «бицепс», «икры», «пресс» или название группы.</div>';
  if (!aBuilt) { aBuilt = true; $('#agr').innerHTML = Object.entries(GN).map(([g, t]) => `<button class="chip" data-g="${g}">${t}</button>`).join('') }
  $('#agr').querySelectorAll('.chip').forEach(c => c.style.display = by[c.dataset.g] ? '' : 'none');
}
$('#allb').onclick = $('#allb2').onclick = () => ruP.then(atlasOpen);
$('#ax').onclick = () => { $('#atlas').classList.remove('on'); tick() };
$('#aq').oninput = () => { renderAtlas(); $('#alst').scrollTop = 0 };
$('#agr').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; const h = $('#ag-' + c.dataset.g); if (h) $('#alst').scrollTo({ top: h.offsetTop - 4, behavior: 'smooth' }); tick() };
$('#alst').onclick = e => { const g = e.target.closest('button[data-g]'); if (g) { openGroup(g.dataset.g); return } const b = e.target.closest('.it'); if (b) openMuscle(b.dataset.k) };
async function toBody() { $('#atlas').classList.remove('on'); if (mode !== 'body') await setMode('body'); setChip('skin', false); setChip('muscles', true); A.turntable(false) }
async function openMuscle(k) {
  tick(); await toBody();
  const re = reOf([k]), all = A.ids(re); if (!all.length) return;
  isoMode = 'one'; isoOn = true; A.isolate('muscles', re); A.highlight(all, 1);
  const near = ['.r', '.l', ''].map(s => ({ s, a: A.ids(new RegExp('^' + esc(k + s) + '$')) })).filter(x => x.a.length).map(x => ({ ...x, sc: A.screen(x.a) })).sort((x, y) => (x.sc ? x.sc.dist : 9) - (y.sc ? y.sc.dist : 9))[0];
  const p = { layer: 'muscles', id: near.a[0], name: k + near.s };
  A.select(p); showInfo(p, { both: all.length > 1 }); flyTo(near.a);
}
function openGroup(g) {
  tick(); toBody().then(() => { const keys = grpKeys(g), re = reOf(keys); closeInfo(); isoMode = 'grp'; isoOn = true; A.isolate('muscles', re); A.highlight([]); flyTo(A.ids(re), true);
    const h = $('#hint'); h.innerHTML = `<b>${GN[g]}</b> — коснитесь мышцы`; h.classList.add('on'); setTimeout(() => h.classList.remove('on'), 3500) });
}
const resetView = () => mode === 'body' ? A.reset(400) : A.frameClip(undefined, 400); // ракурс 3/4 за 0,4 с; в упражнении — всё движение в кадре
$('#reset').onclick = () => { resetView(); if (mode === 'body') { unIso(); closeInfo() } tick() };
if (qs.get('ex')) setMode('ex', qs.get('ex'));
</script>
