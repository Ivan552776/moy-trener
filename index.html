  --grad-tech:radial-gradient(90% 80% at 100% 0%,rgba(255,255,255,.14),transparent 60%),linear-gradient(150deg,#4B3FE0 0%,#3A2FB8 60%,#2A1F8F 100%);

  --spring-sheet:linear(0,.051,.167,.308,.448,.576,.685,.774,.843,.895,.933,.96,.979,.99,.998,1.002,1.004,1.005,1.005,1.004,1.004,1.003,1.002,1.002,1);

/* ---------- типографика ---------- */

.obrv-c{flex:none;width:240px;padding:8px 11px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;gap:3px} .obrv-c .stars{--f:#F5A524}
.obrv-t{font-size:13.5px;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.obrv-n{font-size:12px;font-weight:600;color:var(--text2)} .obrv-tr.solo{padding-right:14px} .obrv-tr.solo .obrv-c{width:auto;flex:1} .obrv-u{padding:0 12px 10px;margin-top:-2px;font-size:12.5px;font-weight:600;color:var(--text2)}
 #onb .has-rv .cover{aspect-ratio:auto;height:min(230px,27dvh);max-height:none}

/* ---------- карточки и раскладка ---------- */

function norm(pr){ // всё считает код, нейросеть цифры не придумывает
  const bmr=10*pr.w+6.25*pr.h-5*pr.age+(pr.sex==='m'?5:-161);
  // группа активности — по работе (МР 2.3.1.0253-21); тренировки — отдельно: ~45 мин при ~5 METs = 4 METs сверх покоя × 0,75 ч ≈ 3 ккал на кг за занятие (Компендиум, ACSM)
  const grp=WORK[pr.work][2],kfa=KFA[grp],base=bmr*kfa,train=Math.round(effTrains(pr)*pr.w*3/7);
  const tdee=base+train,g=GOALS[pr.goal],hm=pr.h/100,bmi=pr.w/(hm*hm),minor=pr.age<18,under=!minor&&bmi<18.5;
  const pk=pr.goal==='lose'||pr.goal==='muscle'?pr.pace:'mid'; // темп выбирают только у «Похудеть» и «Набрать мышцы»
  let adj=g.adj[minor&&pr.goal==='muscle'&&pk==='fast'?'mid':pk]||0;const capped=(minor||under)&&adj<0;if(capped)adj=0;
  let kcal=Math.round(tdee*(1+adj)/10)*10;
  const floor0=pr.sex==='m'?1500:1200,floor=Math.min(floor0,Math.floor(tdee/10)*10),floored=kcal<floor;if(floored)kcal=floor; // безопасный минимум, но не выше расхода
  const refW=bmi>=30?Math.round(25*hm*hm):pr.w,p=Math.round(refW*g.prot),f=Math.round(kcal*.27/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {bmr:Math.round(bmr),grp,kfa,base:Math.round(base),train,tdee:Math.round(tdee),adj,kcal,p,f,c,floored,floor,floor0,bmi:Math.round(bmi*10)/10,minor,under,capped,refW};
}

function hlCards(n,e){const hr=new Date().getHours(),pg=program(),ti=curDay(),done=doneToday(),wd=(new Date().getDay()+6)%7,planToday=!S.plan||S.plan.includes(wd),leftP=n.p-Math.round(e.p),cards=[];

  else if(restDay())cards.push(c('g-v','heart','Тренировка','Сегодня отдых','Мышцы восстанавливаются между занятиями. Прогулка 30 минут — в самый раз.','План недели','openProgram()'));

  if(S.log.length&&hr>=11&&leftP>20)cards.push(c('g-p','muscle','Белок',`Добрать ${u(leftP,'г')}`,'Творог, курица, яйца или рыба — подберём под остаток калорий и бюджет.','Что съесть','openFoodPlan()'));
  else if(S.log.length&&leftP<=0)cards.push(c('g-p','muscle','Белок','Норма закрыта',`${u(Math.round(e.p),'г')} из ${u(n.p,'г')} — мышцам есть из чего восстанавливаться.`,'Питание','openFoodPlan()'));
  if(!(S.remind&&S.remind.on)&&!S.hlRemOff)cards.push(c('g-f','bell','Напоминания','Не забыть про главное','Утром — план на день, вечером — тренировка и белок. Только если есть что напомнить.','Настроить','openRemind()'));
  const lw=S.weights[S.weights.length-1],wAge=lw?(Date.parse(today0())-Date.parse(lw.d))/864e5:99;
  if(wAge>=7)cards.push(c('g-c','weight','Вес',lw?'Пора взвеситься':'Запишите вес','Раз в неделю, утром до завтрака — так норма считается точнее.','Записать','openWeight()'));

function ago(t){const d=Date.now()-t,m=Math.round(d/60000);if(m<60)return 'только что';if(m<60*20)return Math.round(m/60)+' ч назад';const dd=Math.round(m/1440);return dd<=1?'вчера':dd+' дн. назад'}
function weekStrip(){
  const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],wd=(new Date().getDay()+6)%7,n=effTrains(),ti=curDay(),days=[];
  for(let i=0;i<n;i++){let d=Math.max(0,Math.min(6,wd+(i-ti)*2));while(days.includes(d)&&d<6)d++;if(days.includes(d))continue;days.push(d)}
  if(!S.plan){S.plan=planWeek();save()}days.length=0;days.push(...S.plan); // план недели — один раз в неделю, с первого дня, когда открыли приложение
  const today=new Date(),mon=new Date(today);mon.setDate(today.getDate()-wd);
  return `<div class="wk" style="margin:0 0 18px">${names.map((nm,i)=>{const di=days.indexOf(i),done=di>-1&&S.done.includes(di),dt=new Date(mon);dt.setDate(mon.getDate()+i);const dn=!!(S.doneOn&&S.doneOn[ymd(dt)]!=null);return `<div class="d ${dn?'done':di>-1&&i>=wd&&S.done.length<weekPlanCount()?'plan':''} ${i===wd?'today':''}"><i>${dn?ic('check','style="width:16px;height:16px"'):dt.getDate()}</i>${nm}</div>`}).join('')}</div>`;
}
function tip(n,e){
  const g=S.profile.goal,leftP=n.p-Math.round(e.p),h=new Date().getHours(),sg=suggest(),lunch=S.log.some(x=>+x.t.slice(0,2)>=11);
  if(h<5&&e.k<=n.kcal)return 'Ночь — время сна. Утром начнём с завтрака, норму посчитаю заново.';
  if(!S.log.length)return h>=21?'Поздний вечер: если ели днём — запишите, чтобы день сошёлся. На ночь калории не добираем.':h<11?'Начнём день: запишите завтрак — по фото или из базы. Остаток и белок посчитаю сам.':'Запишите, что уже ели сегодня — по фото или из базы. Остаток и белок посчитаю сам.';
  if(h>=21&&e.k<=n.kcal)return g==='muscle'?'Поздний вечер: если белка не хватает — творог перед сном, остальное завтра.':'Поздний вечер: на ночь калории не добираем. Если голодно — стакан кефира или творог, остальное — завтра по плану.';
  if(e.k>n.kcal)return e.k>n.kcal*1.3?`Сегодня ${u(e.k-n.kcal,'ккал')} сверх нормы — проверьте граммы в записях: может, ошибка в весе порции. Один день план не ломает.`:`Вышли за норму на ${u(e.k-n.kcal,'ккал')}. Бывает — завтра едим по плану, без урезания.`;
  if(g==='muscle')return leftP>40?`Для роста мышц добираем белок: осталось ${u(leftP,'г')}. После тренировки — творог или курица.`:(S.profile.place==='home'?'Белок в норме. Сегодня добавьте 2–3 повтора в приседаниях или замедлите опускание.':'Белок в норме. Сегодня прибавьте вес в жиме ногами, если 8 повторов дались легко.');
  if(g==='endurance')return S.done.includes(curDay())?'После интервалов в течение 1–2 часов — углеводы с белком: каша, творог, банан. Пейте воду.':'Перед интервалами — углеводы за 1,5–2 часа: каша или банан. Пейте воду по ходу тренировки.';
  if(leftP>60)return `До нормы белка не хватает ${u(leftP,'г')} — так мышцы не уходят вместе с жиром. ${sg.why==='small'?'На такой бюджет готовые блюда не помещаются — доберите дешёвым: яйца, творог, кефир, крупы.':sg.why==='money'?'Бюджет на сегодня закончился — доберите тем, что есть дома: яйца, творог, кефир.':'Подберу '+(h<11||(h<16&&!lunch)?'обед':'ужин')+' с белком под ваш бюджет.'}`;
  if(leftP>25&&h>=16)return `Белка не хватает ${u(leftP,'г')} — доберите перекусом: творог или кефир.`;
  return `Сегодня всё по плану. Вечером — ${program().days[curDay()].replace(/^./,c=>c.toLowerCase())}, около 45&nbsp;минут.`;
}

function suggest(){
  const pr=S.profile,n=norm(pr),e=eaten(),hr=new Date().getHours();
  const remK=Math.max(n.kcal-e.k,0),remP=Math.max(n.p-Math.round(e.p),0),budget=Math.max(budgetOf(pr)-e.cost,0),late=hr>=21||hr<5,lunch=S.log.some(x=>+x.t.slice(0,2)>=11);
  const mealsLeft=hr<11?3:hr<16&&!lunch?2:1,target=Math.max(250,remK/mealsLeft),needP=remP/mealsLeft;
  const brk=hr>=5&&hr<11&&!S.log.some(x=>+x.t.slice(0,2)>=5); // утром до первой записи — сначала завтраки (то же условие, что ateNow на «Сегодня»)
  let pool=MEALS.filter(m=>m.price<=budget&&m.nut.k<=remK+150);if(brk&&pool.some(m=>m.b))pool=pool.filter(m=>m.b);
  const list=late?[]:pool.map(m=>({...m,score:-Math.abs(m.nut.k-target)/target+0.6*Math.min(m.nut.p/Math.max(needP,1),1.2)-m.price/Math.max(budget,1)*.15})).sort((a,b)=>b.score-a.score).slice(0,3);
  const cheap=Math.min(...MEALS.map(m=>m.price));
  const why=list.length?'':e.k>n.kcal?'over':late?'late':remK<=250?'full':(budgetOf(pr)<cheap||!e.cost)?'small':'money'; // small — бюджет меньше готовых блюд, а не «закончился»
  return {remK,remP,budget,list,why,late,cheap};
}

async function loadDB(){
  if(DB&&!DB.failed)return DB;
  try{const ok=r=>{if(!r.ok)throw new Error(r.status);return r.json()};const [pr,ds,al]=await Promise.all([fetch('data/products.json').then(ok),fetch('data/dishes.json').then(ok),fetch('data/aliases.json').then(r=>r.json()).catch(()=>({}))]);
    DB={products:pr,dishes:ds};DBI={};pr.forEach(x=>{P[x.id]={n:x.n,p:x.p,f:x.f,c:x.c};DBI[norm_(x.n)]=x.id});Object.entries(al).forEach(([n,id])=>{if(!DBI[norm_(n)])DBI[norm_(n)]=id}); // алиасы: имя из рецепта -> id продукта
    (S.custom||[]).forEach(x=>{if(!pr.find(p=>p.id===x.id))pr.push(x)});
  }catch(e){console.warn('база продуктов не загрузилась',e);DB={products:[...(S.custom||[])],dishes:[],failed:true};DBI={}} // сбой не запоминаем: в следующий раз пробуем снова
  return DB;
}
function findProduct(name){const k=norm_(name);if(DBI[k])return DBI[k];const hit=Object.keys(DBI).find(n=>n.startsWith(k)||k.startsWith(n));return hit?DBI[hit]:null}
function searchDB(q){
  const k=norm_(q);if(!k)return{products:[],dishes:[]};const words=k.split(' ');
  const score=n=>{const s=norm_(n);if(s===k)return 3;if(s.startsWith(k))return 2;return words.every(w=>s.includes(w))?1:0};
  const products=DB.products.map(x=>[score(x.n),x]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length).slice(0,20).map(a=>a[1]);
  const dishes=DB.dishes.map(x=>[score(x.n),x]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]).slice(0,10).map(a=>a[1]);
  return{products,dishes};
}

let PP=null;
function productPortion(id,g){

   ${x.odd?`<div class="small" style="margin:0 4px 8px;color:var(--warn-text)">Цифры этикетки не сходятся (по составу ≈${fmt(x.calcK)} ккал на 100 г) — проверьте упаковку</div>`:''}<div class="src" style="margin:0 4px 10px">Источник: ${(x.src||'база приложения').replace(/;?\s*цифры по памяти,?\s*проверить/i,' · цифры ещё сверяем с таблицей')} · считает код: ${x.kcal?'ккал на 100 г × граммы':'Б×4 + Ж×9 + У×4'}</div>
   <button class="btn" onclick="logProduct()">Записать в дневник</button><button class="btn ghost" onclick="openSearch('${x.n.replace(/'/g,'')}')">Назад к поиску</button>`);

function logProduct(){S.foodN=(S.foodN||0)+1;if(S.day!==today0())rollDay();const x=DB.products.find(p=>p.id===PP.id),k=PP.g/100,kc=(x.kcal||kcalOf(x))*k;S.log.push({d:today0(),t:new Date().toTimeString().slice(0,5),n:x.n+' · '+PP.g+' г',img:x.img||'',k:kc,p:x.p*k,f:x.f*k,c:x.c*k,cost:0,acc:'высокая',src:x.id.startsWith('off_')||x.mine?'этикетка':'база'});S.entries=(S.entries||0)+1;save();closeSheet();DIR='';S.tab='today';render();toTop();kc>1500?toast('Записано '+u(kc,'ккал')+' за одну запись — проверьте граммы',true):toast('Записано · '+u(kc,'ккал'))}
function dishFromDB(id){
  const d=DB.dishes.find(x=>x.id===id);if(!d)return;const miss=[];
  const parts=d.parts.map(pt=>{
    const recipe=pt.items.map(([name,g])=>{const pid=findProduct(name);if(!pid)miss.push(name);return pid?[pid,g]:null}).filter(Boolean);
    const base=pt.g||recipe.reduce((s,r)=>s+r[1],0)||100;
    // добавка переключателя — в тех же единицах, что и пункты рецепта (на 100 г части), иначе при порции 200 г она удваивается
    const toggles=(pt.toggles||[]).map(t=>{const pid=findProduct(t.add[0]);return pid?{label:t.label,on:!!t.on,add:[pid,t.add[1]/base*100]}:null}).filter(Boolean);
    if(pt.ask==='штуки'){const per=pt.per||base;return{name:pt.name,count:pt.count||1,per,perOpts:[Math.round(per*.75),per,Math.round(per*1.25)],recipe:recipe.map(([k,g])=>[k,g/base*100]),toggles}}
    return{name:pt.name,grams:base,min:0,max:Math.max(300,base*2),step:10,quick:[Math.round(base/2/10)*10,base,Math.round(base*1.5/10)*10],recipe:recipe.map(([k,g])=>[k,g/base*100]),toggles};
  });
  // переключатели на всё блюдо («Со сметаной» у сырников и борща) — к первой части, граммы как есть
  if(parts.length)(d.toggles||[]).forEach(t=>{const pid=findProduct(t.add[0]);if(pid)(parts[0].toggles=parts[0].toggles||[]).push({label:t.label,on:!!t.on,abs:true,add:[pid,t.add[1]]})});
  const dish={name:d.n,cost:0,parts,tone:['#F4E3B5','#9C5B34','#EDEAE0'],fromDB:true,srcText:d.src};
  if(miss.length)toast('Нет в базе: '+miss.slice(0,2).join(', '),true);
  // из поиска — сразу к уточнению, без показного «распознавания»; фото оставляем, только если человек пришёл сюда со своего снимка
  if(!SC)SC={photo:null};SC.id='db_'+id;SC.d=dish;sheet(dish.name,'');clarify();
}

/* ---------- Мировая база: Open Food Facts (штрихкод и поиск), считает код ---------- */
const OFF_FIELDS='code,product_name,product_name_ru,brands,nutriments,quantity,image_small_url,serving_size';
function offToProduct(pr){const n=pr.nutriments||{},num=v=>v==null||v===''?null:+v;const p=num(n.proteins_100g)||0,f=num(n.fat_100g)||0,c=num(n.carbohydrates_100g)||0;let kcal=num(n['energy-kcal_100g']);if(kcal==null&&n.energy_100g)kcal=Math.round(n.energy_100g/4.184);if(kcal==null)kcal=Math.round(p*4+f*9+c*4);
  const name=clean(pr.product_name_ru||pr.product_name)||'Без названия',brand=clean((pr.brands||'').split(',')[0]);
  const qm=/(\d+(?:[.,]\d+)?)\s*(г|g|гр|мл|ml)\b/i.exec(pr.quantity||''),qg=qm?Math.round(parseFloat(qm[1].replace(',','.'))):0;
  const calc=p*4+f*9+c*4,odd=kcal>0&&Math.abs(calc-kcal)/Math.max(kcal,calc)>0.35;
  return {odd,calcK:Math.round(calc),id:'off_'+String(pr.code||'').replace(/[^0-9A-Za-z_-]/g,''),n:brand&&!name.toLowerCase().includes(brand.toLowerCase())?name+' · '+brand:name,cat:'мировая база',p,f,c,kcal,portion:qg>0&&qg<=600?{g:qg,name:'упаковка '+clean(pr.quantity)}:{g:100,name:'100 г'},src:'Open Food Facts, этикетка производителя · код '+clean(pr.code),img:/^https:\/\//.test(pr.image_small_url||'')?pr.image_small_url:'',code:clean(pr.code),qty:clean(pr.quantity)}}
async function offProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}?fields=${OFF_FIELDS}`);if(r.status===404)return null;if(!r.ok)throw new Error('сервер базы не отвечает');
  const j=await r.json();if(j.status!==1||!j.product)return null;return offToProduct(j.product);
}
async function offSearch(q,signal){
  const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${OFF_FIELDS}`;
  const r=await fetch(url,{signal});if(!r.ok)throw new Error('503');const j=await r.json();return (j.products||[]).filter(x=>x.nutriments&&(x.nutriments['energy-kcal_100g']!=null||x.nutriments.proteins_100g!=null)).map(offToProduct);
}

const NONET='<div class="card small muted" style="margin-top:10px">Нет интернета. Показали нашу базу — она хранится в телефоне. Мировая база и штрихкод заработают, когда появится связь.</div>';

async function exSubs(vid,fr){const n=exSubs.n,live=()=>n===exSubs.n&&fr.isConnected;
  exSubs.idx=exSubs.idx||fetch('data/subs/index.json').then(r=>r.ok?r.json():null).then(j=>new Set(j&&j.ids||[])).catch(()=>{exSubs.idx=null;return new Set()}); // список готовых: лишних запросов (и 404) нет
  let segs=null;exSubs.c=exSubs.c||{};if((await exSubs.idx).has(vid)){if(!(vid in exSubs.c))try{const r=await fetch('data/subs/'+encodeURIComponent(vid)+'.json');if(r.ok){const j=await r.json();if(j&&Array.isArray(j.segs))exSubs.c[vid]=j.segs}}catch(e){}segs=exSubs.c[vid]||null}
  if(!live())return;const chip=$('#exsubchip'),box=$('#exsub');
  if(!segs){const cap=$('#excap');if(cap)cap.insertAdjacentHTML('afterend','<div id="exsubnote" class="tiny muted" style="margin:4px 4px 0">Видео на английском — смотрите движение, шаги на русском ниже</div>');return}
  if(!segs.length)return; // в ролике нет речи
  const on=()=>S.subs!==false,paint=()=>{if(chip)chip.innerHTML=`<button class="tiny" style="font-weight:700;color:${on()?'var(--accent-text)':'var(--text2)'}" onclick="S.subs=${on()?'false':'true'};save();exSubs.paint&&exSubs.paint()">Рус. субтитры: ${on()?'вкл':'выкл'}</button>`;if(box){box.innerHTML='';cur=-1}};
  let cur=-1;exSubs.paint=paint;paint();
  const show=s=>{if(!on()||!box)return;const k=segs.findIndex(g=>s>=g[0]&&s<g[1]);if(k===cur)return;cur=k;box.innerHTML=k<0?'':`<span>${String(segs[k][2]).replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;')}</span>`};
  const stop=()=>{removeEventListener('message',onMsg);clearInterval(ping)};
  const onMsg=e=>{if(!live())return stop();if(e.source!==fr.contentWindow)return;let d=e.data;try{if(typeof d==='string')d=JSON.parse(d)}catch(x){return}
    const t=d&&d.info&&d.info.currentTime;if(typeof t==='number')show(t)};
  addEventListener('message',onMsg);
  const hello=()=>{try{fr.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(e){}};
  fr.addEventListener('load',hello);hello();
  const ping=setInterval(()=>{if(!live())return stop();hello()},1000)}

/* ---------- Работа без интернета и на мобильной сети: всё своё на нашем сервере, сохраняется в телефоне (сервис-воркер sw.js + кэш моделей) ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))try{navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(reg=>{reg.active&&reg.active.postMessage({cachePage:location.href.split('#')[0]});setTimeout(()=>{try{reg.active&&reg.active.postMessage({tidy:1})}catch(e){}},6000)} /* и через 6 с — доперенести скачанное в новую версию и убрать старую копию */).catch(()=>{})}catch(e){}
try{if(sessionStorage.getItem('mt-dl')){sessionStorage.removeItem('mt-dl');setTimeout(()=>{openOffline();prefetchAll()},800)}}catch(e){} // продолжаем «Скачать» после перезагрузки
function openOffline(){
  const cell=navigator.connection&&/cellular/.test(navigator.connection.type||'');
  sheet('Работа без интернета',`<div class="card"><div class="title" style="font-size:16px">${S.offline?'Всё уже в телефоне':'Скачать один раз — дальше без сети'}</div>
   <div class="small muted" style="margin-top:6px">Распознавание блюд (~72 МБ), движок нейросети (~27 МБ, при передаче меньше), камера упражнений (~15 МБ), базы продуктов и упражнений. После скачивания фото еды и разбор техники работают в магазине, на улице и в зале без интернета; видео техники — по сети.</div>
   ${cell?'<div class="small" style="margin-top:8px;color:var(--warn)">Сейчас мобильная сеть — лучше скачать по Wi-Fi.</div>':''}</div>
   <div class="card"><div class="row between"><span class="small muted" id="offst">${S.offline?'Готово':'Не скачано'}</span><span class="num" id="offpct">${S.offline?'100%':''}</span></div><div class="bar" style="margin-top:8px"><i id="offbar" style="width:${S.offline?100:0}%;background:var(--accent)"></i></div></div>
   <button class="btn" onclick="prefetchAll()">${S.offline?'Обновить':'Скачать сейчас'}</button>`)}
async function prefetchAll(){
  const st=(t,p)=>{const a=$('#offst'),b=$('#offpct'),c=$('#offbar');if(a)a.textContent=t;if(p!=null){if(b)b.textContent=Math.round(p)+'%';if(c)c.style.width=p+'%'}};
  try{try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}
    // файлы сохраняет сервис-воркер — только те, что прошли через него: если он ещё не взял страницу под себя, ждём (иначе «готово», а без сети не работает)
    if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){st('Готовим память телефона…',2);await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(r,5000))]);
      if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,4000)})}
    // страницу перезагрузили, пока ставился сервис-воркер, — он уже работает, но эту вкладку не взял. Одна обычная перезагрузка это лечит (не больше раза за вкладку)
    if('serviceWorker' in navigator&&!navigator.serviceWorker.controller){const reg=await navigator.serviceWorker.getRegistration().catch(()=>null);let tried=true;try{tried=!!sessionStorage.getItem('mt-dl-tried');if(!tried)sessionStorage.setItem('mt-dl-tried','1')}catch(e){}
      if(reg&&reg.active&&!tried){st('Память готова — перезапускаем страницу, скачивание продолжится само…',2);try{sessionStorage.setItem('mt-dl','1')}catch(e){}location.reload();return}}
    if(!('serviceWorker' in navigator)||!navigator.serviceWorker.controller){st('Этот браузер не даёт сохранить приложение (частный режим или запрет данных сайта) — без сети оно не откроется. Откройте в обычном окне Safari или Chrome',null);return}
    st('Базы продуктов и упражнений…',5);
    // данные — заново и мимо кэша браузера: так они точно проходят через сервис-воркер и сохраняются, даже если первая загрузка была до него
    await Promise.all(['data/products.json','data/dishes.json','data/aliases.json','data/exercises.json','data/exercise-videos.json','data/ex-recog.json','models/clipdb.json','models/clipdb.bin'].map(u=>fetch(u,{cache:'reload'}).then(r=>{if(!r.ok)throw new Error(u+' — '+r.status)})));
    await Promise.all([loadDB(),loadEX(),loadExRecog(),loadExVid()]);
    if(!DB||DB.failed||!DB.products.length||!EXL||!EXL.length||!EXVID||!Object.keys(EXVID).length||!EXR.d)throw new Error('не скачались базы продуктов и упражнений');
    st('Распознавание блюд…',15);await loadClip(t=>{const m=/(\d+)%/.exec(t);st('Распознавание блюд… '+(m?m[1]+'%':'запускаем'),m?15+(+m[1])*.6:null)});
    st('Камера упражнений…',80);await loadExClip();
    // модель позы только скачиваем (сама запустится при разборе) — раньше здесь экран замирал на её запуске
    if(!await posePrefetch((t,p)=>st('Камера упражнений… '+(p==null?'':p+'%'),p==null?null:80+p*.15)))throw new Error('модель разбора скачалась не полностью');
    await Promise.all(['mediapipe/vision_bundle.mjs','mediapipe/wasm/vision_wasm_internal.js'].map(f=>fetch(LIB(f)).then(r=>{if(!r.ok)throw new Error(f+' — '+r.status)})));
    st('Картинки…',95);{const ids=(EXL||[]).map(x=>x.id);for(let i=0;i<ids.length;i+=24)await Promise.all(ids.slice(i,i+24).map(id=>fetch(EXIMG(id)+'t.jpg').catch(()=>{})))}await Promise.all([...new Set([...Object.values(DISHES).map(d=>d.img),...MEALS.map(m=>m.img),'img/tech-demo.jpg','img/anat/base.png','squat.mp4',...(S.log||[]).map(e=>e.img).filter(u=>u&&!u.startsWith('data:'))])].filter(Boolean).map(u=>fetch(u).catch(()=>{}))); // примеры блюд и иллюстрации — чтобы без сети не было пустых мест
    try{const reg=navigator.serviceWorker&&await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),3000))]);reg&&reg.active&&reg.active.postMessage({cachePage:location.href.split('#')[0]})}catch(e){} // без сервис-воркера (http, старый браузер) ready не наступает — не ждём вечно
    S.offline=Date.now();save();st('Готово — работает без интернета',100);haptic([10,40,10]);toast('Скачано: работает без интернета');if(S.tab==='me')setTimeout(rerender,300)}
  catch(e){console.error(e);st('Не получилось: '+(/fetch|network|load failed/i.test(e.message||'')?'нет связи':(e.message||e))+'. Проверьте связь и попробуйте ещё раз',null)}}

  return `<div class="top"><div><div class="eyebrow">${EXL?pl(EXL.length,'упражнение','упражнения','упражнений')+' · дом и зал':'Библиотека упражнений'}</div><div class="date">Атлас</div></div><button class="avatar tap" onclick="go('me')" aria-label="Личный кабинет">${ava()}</button></div>

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today0(){return ymd(new Date())}
function monday0(){const m=new Date();m.setDate(m.getDate()-(m.getDay()+6)%7);return ymd(m)}

/* ---------- сервер: номер устройства, счётчик заходов, отзывы ----------
   Сервера может ещё не быть или не быть сети — всё молча (console.warn), интерфейс честно пишет, что не получилось.
   На сервер уходят только случайный номер устройства (без имени и телефона), версия, часовой пояс и отзыв, если его оставили. */
function newDid(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}
  const b=new Uint8Array(16);try{crypto.getRandomValues(b)}catch(e){for(let i=0;i<16;i++)b[i]=Math.random()*256|0}
  b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}
async function api(path,body){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
  try{const r=await fetch(API+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:ac.signal,credentials:'omit',cache:'no-store',mode:'cors'});
    let data=null;if(r.status!==204){try{data=await r.json()}catch(e){}}
    if(!r.ok)console.warn('Сервер:',path,r.status);return {ok:r.ok,status:r.status,data}}
  catch(e){console.warn('Сервер недоступен:',path,(e&&e.name)||e);return {ok:false,status:0,data:null,offline:!navigator.onLine}}
  finally{clearTimeout(t)}}

async function rvLoad(force){if(RVDEMO){RV.st='ok';return}if(RV.busy||(!force&&RV.at&&Date.now()-RV.at<10*60e3))return;RV.at=Date.now();
  if(!navigator.onLine){RV.st='offline';rvPaint();return}
  RV.busy=true;if(RV.st==='idle')RV.st='loading';const [r,st]=await Promise.all([api('/reviews?limit=50'),api('/stats')]);RV.busy=false;
  if(st.ok&&st.data&&typeof st.data==='object'){const num=v=>Number.isFinite(+v)&&+v>=0?Math.round(+v):0;S.rvStats={users:num(st.data.users_total),reviews:num(st.data.reviews_total),at:Date.now()}}
  if(r.ok&&Array.isArray(r.data)){const got=r.data.map(rvNorm).filter(Boolean),ids=new Set(got.map(x=>x.id));
    // свой свежий отзыв показываем, даже если сервер его ещё не отдаёт (сутки)
    const mine=rvList().filter(x=>x.mine&&!ids.has(x.id)&&Date.now()-x.ts<864e5);
    got.forEach(x=>{if((S.rvMine||[]).includes(x.id))x.mine=true});
    S.rv={list:[...mine,...got].sort((a,b)=>b.ts-a.ts).slice(0,50),at:Date.now()};RV.st='ok';save()}
  else{RV.st=r.offline?'offline':'noserver';RV.at=Date.now()-10*60e3+30e3;clearTimeout(rvLoad.t);rvLoad.t=setTimeout(()=>{if(!$('#onb').classList.contains('hide')||S.tab==='today')rvLoad()},31e3)} // не получилось — повторим через 30 с, а не через 10 минут
  rvPaint()}
function rvPaint(){document.querySelectorAll('.rvbox').forEach(el=>{el.innerHTML=rvInner()});rvtPaint();obRvPaint();const a=$('#rvall');if(a)a.innerHTML=rvAllInner()}
function rvNote(n){if(RVDEMO)return 'Пример: так отзывы будут выглядеть — это не настоящие отзывы';return RV.st==='offline'?(n?'Сохранённые отзывы · обновятся, когда появится интернет':''):RV.st==='noserver'?(n?'Сохранённые отзывы · сервер сейчас не отвечает':''):''}
function rvEmpty(){const [t,s]=RV.st==='offline'?['Отзывы загрузятся, когда появится интернет','Свой можно написать и сейчас — черновик сохранится']
  :RV.st==='ok'?['Пока отзывов нет — будьте первым','Расскажите, что получилось и чего не хватает']
  :RV.st==='noserver'?['Отзывы скоро появятся — будьте первым','Расскажите, что получилось и чего не хватает']:['Загружаем отзывы…',''];
  return `<div class="row" style="align-items:flex-start"><div class="ibox warn">${ic('star')}</div><div style="flex:1;min-width:0"><div style="font-weight:600;text-wrap:balance">${t}</div>${s?`<div class="small muted" style="margin-top:2px">${s}</div>`:''}</div></div>`}
function rvItem(x,short){return `<div class="li rv-it${short?' rv-short':''}"><div style="flex:1;min-width:0"><div class="row between" style="gap:8px"><b class="rv-nm">${esc(x.name)||'Пользователь'}${x.mine?' <span class="pill ok" style="padding:2px 8px;font-size:12px">ваш</span>':''}</b><span class="tiny muted" style="flex:none">${rvDate(x.ts)}</span></div><div style="margin-top:4px">${stars(x.stars,14)}</div>${x.text?`<div class="rv-tx">${esc(x.text)}</div>`:''}</div></div>`}
const rvAvg=L=>L.reduce((s,x)=>s+x.stars,0)/L.length;
// «пользуются 340 человек» — по ответу сервера GET /stats, если он есть; без сервера строки нет
function rvUsers(){const u=S.rvStats&&S.rvStats.users;if(!(u>=1))return '';const a=u%100,b=u%10;return (b===1&&a!==11?'пользуется ':'пользуются ')+pl(u,'человек','человека','человек')}
function rvSum(L,big){const n=L.length,avg=rvAvg(L),tot=Math.max(n,(S.rvStats&&S.rvStats.reviews)||0),us=rvUsers();
  return `<div class="rv-sum${big?' big':''}"><span class="${big?'n-xl':'n-l'}">${avg.toFixed(1).replace('.',',')}</span><div style="min-width:0">${stars(avg,big?22:18)}<div class="small muted" style="margin-top:4px">${n>=50&&tot<=n?'50+ отзывов':pl(tot,'отзыв','отзыва','отзывов')}${us?' · <span style="white-space:nowrap">'+us+'</span>':''}</div></div></div>`}
const rvDraftOn=()=>!!(S.rvDraft&&(S.rvDraft.stars||(S.rvDraft.text||'').trim()));
function rvInner(){const L=rvList(),n=L.length,note=rvNote(n);
  return `<div class="card rv">${n?`<button class="rv-top tap" onclick="openReviews()" aria-label="Все отзывы">${rvSum(L)}<span class="chev">${ic('chev')}</span></button><div class="list">${L.slice(0,3).map(x=>rvItem(x,true)).join('')}</div>`:rvEmpty()}
   ${note?`<div class="tiny muted rv-note">${note}</div>`:''}
   <div class="rv-acts">${n?`<button class="btn sec sm" onclick="openReviews()">Все отзывы</button>`:''}<button class="btn sm" onclick="openReviewForm()">${rvDraftOn()?'Дописать отзыв':'Оставить отзыв'}</button></div></div>`}
function rvBlock(){if(!RV.at||Date.now()-RV.at>10*60e3)setTimeout(()=>rvLoad(),0);return `<h2>Отзывы</h2><div class="rvbox">${rvInner()}</div>`}
/* бегущая строка отзывов на «Сегодня» (под неделей): «Марина ★★★★★ — „за неделю минус 1,5 кг…“».
   Едет CSS-анимацией transform по продублированной ленте — скрипт каждый кадр ничего не перерисовывает.
   Отзывов нет, нет сети и сохранённых — строки нет совсем. «Уменьшить движение» — без движения, смена раз в 5 с. */
const RVT={sig:'',w:0,t0:Date.now(),i:0,iv:0,io:null};
function rvtList(){return rvList().filter(x=>x.stars>=4&&x.text.length>=3).slice(0,12)} // свежие сверху, с текстом; все — в «Все отзывы»
function rvtCut(t){t=t.replace(/\s+/g,' ').trim();if(t.length<=64)return t;const c=t.slice(0,64),sp=c.lastIndexOf(' ');return (sp>40?c.slice(0,sp):c).replace(/[\s,.;:!?—–-]+$/,'')+'…'}
function rvtItem(x){return `<span class="rvt-it"><b>${esc(x.name)||'Пользователь'}</b><span class="rvt-st">${'★'.repeat(x.stars)}<i>${'★'.repeat(5-x.stars)}</i></span><span class="rvt-tx">— «${esc(rvtCut(x.text))}»</span></span>`}
function rvtSig(L){return (RM?'rm|':'')+L.map(x=>x.id+':'+x.stars+':'+x.text.length).join(',')}
function rvTicker(){const L=rvtList();if(!L.length){RVT.sig='';return ''}
  const all=rvList(),avg=rvAvg(all).toFixed(1).replace('.',','),sig=rvtSig(L);
  const lab=`Отзывы: средняя оценка ${avg} из 5, ${pl(Math.max(all.length,(S.rvStats&&S.rvStats.reviews)||0),'отзыв','отзыва','отзывов')}. Открыть все отзывы`;
  const head=`<button class="rvt tap${RM?' rm':''}" onclick="openReviews()" aria-label="${lab}">${RVDEMO?'<span class="pill obrv-demo" style="margin-left:8px">пример</span>':''}<span class="rvt-avg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${STAR_D}"/></svg>${avg}</span><span class="rvt-win" aria-hidden="true">`;
  queueMicrotask(rvtFix); // после вставки в страницу: замер ленты (один раз на набор отзывов) и пауза за краем экрана
  if(RM){const i=RVT.i%L.length;return head+L.map((x,j)=>rvtItem(x).replace('class="rvt-it"',`class="rvt-it${j===i?' on':''}"`)).join('')+'</span></button>'}
  // лента повторяется, пока половина заметно шире окна (оценка по числу знаков, точный замер — в rvtFix)
  let one=L.map(rvtItem).join(''),chars=L.reduce((s,x)=>s+(x.name||'Пользователь').length+rvtCut(x.text).length+12,0),half=one;
  for(let k=1;chars*k*7.2<900&&k<8;k++)half+=one;
  const st=sig===RVT.sig&&RVT.w?rvtStyle(RVT.w):'';
  return head+`<span class="rvt-track" style="${st}"><span class="rvt-half">${half}</span><span class="rvt-half">${half}</span></span></span></button>`}
// скорость ~34 px/с; сдвиг по времени с запуска — после перерисовки экрана лента продолжает с того же места, а не прыгает в начало
function rvtStyle(w){const d=Math.max(12,w/34);return `--rvt-d:${d.toFixed(2)}s;--rvt-o:-${(((Date.now()-RVT.t0)/1000)%d).toFixed(2)}s`}
function rvtFix(){const el=document.querySelector('.rvtbox .rvt');if(RVT.io){RVT.io.disconnect();RVT.io=null}
  if(!el){RVT.sig='';return}
  const L=rvtList(),sig=rvtSig(L);
  if(RM){RVT.sig=sig;if(!RVT.iv)RVT.iv=setInterval(rvtRot,5000);return}
  const tr=el.querySelector('.rvt-track'),h=tr&&tr.firstElementChild;
  if(tr&&h&&!(sig===RVT.sig&&RVT.w)){const win=el.querySelector('.rvt-win').offsetWidth;let w=h.offsetWidth;
    if(w&&w<win+60){const k=Math.ceil((win+60)/w);[...tr.children].forEach(x=>{const src=x.innerHTML;x.innerHTML=src.repeat(k+1)});w=h.offsetWidth} // узкий набор — добавили повторов
    RVT.w=w;RVT.sig=sig;tr.setAttribute('style',rvtStyle(w))}
  if('IntersectionObserver' in window){RVT.io=new IntersectionObserver(es=>{es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting))});RVT.io.observe(el)}}
function obRv(){const L=rvtList().slice(0,8);if(!L.length)return '';const solo=L.length===1;/* один отзыв — одна карточка на всю ширину, без движения */const all=rvList(),avg=rvAvg(all).toFixed(1).replace('.',',');
  const card=x=>`<div class="obrv-c">${stars(x.stars,13)}<div class="obrv-t">«${esc(x.text.replace(/\s+/g,' ').trim())}»</div><div class="obrv-n">${esc(x.name)||'Пользователь'}</div></div>`,one=L.map(card).join('');
  const d=Math.max(20,L.length*7),u=S.rvStats&&S.rvStats.users,us=u>=1?`<div class="obrv-u">Уже ${u%10===1&&u%100!==11?'пользуется':'пользуются'} ${pl(u,'человек','человека','человек')}</div>`:''; // ~36 px/с при карточке 240 px + 12 px
  return `<button class="obrv tap" onclick="openReviews()" aria-label="Отзывы: средняя оценка ${avg} из 5. Открыть все отзывы"><div class="obrv-h">${stars(rvAvg(all),14)}<b>${avg}</b><span class="muted" style="flex:none">·&nbsp;${pl(Math.max(all.length,(S.rvStats&&S.rvStats.reviews)||0),'отзыв','отзыва','отзывов')}</span>${RVDEMO?'<span class="pill obrv-demo">пример</span>':''}</div>
   <div class="obrv-win" aria-hidden="true"><div class="obrv-tr${RM||solo?' rm':''}${solo?' solo':''}" style="--obrv-d:${d}s">${one}${RM||solo?'':one}</div></div>${us}</button>`}
function obRvPaint(){const b=$('#obrv');if(!b||$('#onb').classList.contains('hide'))return;const h=obRv();b.innerHTML=h;const c=$('#obcv');if(c)c.classList.toggle('has-rv',!!h)}
function rvtRot(){const el=document.querySelector('.rvtbox .rvt.rm');if(!el){clearInterval(RVT.iv);RVT.iv=0;return}
  if(document.hidden||$('#sheet').classList.contains('on'))return;
  const it=el.querySelectorAll('.rvt-it');if(it.length<2)return;RVT.i=(RVT.i+1)%it.length;it.forEach((x,j)=>x.classList.toggle('on',j===RVT.i))}
// свежие отзывы пришли — строку меняем, только если набор изменился (иначе не дёргаем анимацию)
function rvtPaint(){const box=document.querySelector('.rvtbox');if(!box)return;const L=rvtList(),sig=L.length?rvtSig(L):'';
  if(sig&&sig===RVT.sig&&box.firstElementChild){const a=box.querySelector('.rvt-avg');if(a)a.lastChild.textContent=rvAvg(rvList()).toFixed(1).replace('.',',');return}
  if(!sig&&!box.firstElementChild)return;RVT.w=0;box.innerHTML=rvTicker()}
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('pg-hid',document.hidden));
function rvAllInner(){const L=rvList(),n=L.length,note=rvNote(n);if(!n)return `<div class="card">${rvEmpty()}</div><button class="btn" onclick="openReviewForm()">${rvDraftOn()?'Дописать отзыв':'Оставить отзыв'}</button>`;
  const cnt=[5,4,3,2,1].map(s=>[s,L.filter(x=>x.stars===s).length]);
  return `<div class="card">${rvSum(L,true)}<div class="rv-bars">${cnt.map(([s,c])=>`<div class="rv-bar"><span class="tiny muted">${s}</span><div class="bar"><i style="width:${c/n*100}%"></i></div><span class="tiny muted">${c}</span></div>`).join('')}</div>${note?`<div class="tiny muted rv-note">${note}</div>`:''}</div>
   <div class="card list">${L.map(x=>rvItem(x)).join('')}</div>
   <button class="btn" onclick="openReviewForm()">${rvDraftOn()?'Дописать отзыв':'Оставить отзыв'}</button>
   <div class="concept">Отзывы пишут пользователи приложения · средняя оценка считается по ${n>=50?'последним 50':'всем'} отзывам</div>`}
function openReviews(){sheet('Отзывы',`<div id="rvall">${rvAllInner()}</div>`);rvLoad()}
function openReviewForm(){if(S.askedReview===today0())S.askedReview='done';const d=S.rvDraft=Object.assign({stars:0,name:'',text:''},S.rvDraft);save();
  sheet('Ваш отзыв',`<div class="card" style="text-align:center"><div class="small muted">Как вам «Мой тренер»?</div>
    <div class="starpick" role="radiogroup" aria-label="Оценка">${[1,2,3,4,5].map(i=>`<button role="radio" aria-checked="${d.stars===i}" aria-label="${pl(i,'звезда','звезды','звёзд')}" class="${i<=d.stars?'on':''}" onclick="rvStar(${i})"><svg viewBox="0 0 24 24"><path d="${STAR_D}"/></svg></button>`).join('')}</div>
    <div class="small" id="rvcap" style="min-height:18px;font-weight:600;color:${d.stars?'var(--text)':'var(--text2)'}">${RVCAP[d.stars]||'Коснитесь звезды'}</div></div>
   <div class="card"><label class="small muted" for="rv_n" style="display:block;margin-bottom:6px">Имя — необязательно</label>
    <input type="text" id="rv_n" class="search plain" maxlength="40" autocomplete="off" placeholder="Как подписать отзыв" value="${esc(d.name)}" oninput="rvDraftSet('name',this.value)">
    <div class="row between" style="margin:14px 0 6px"><label class="small muted" for="rv_t">Что понравилось, чего не хватает</label><span class="tiny muted" id="rvcnt" style="flex:none">${d.text.length} / 600</span></div>
    <textarea id="rv_t" class="ta" maxlength="600" rows="5" placeholder="Например: удобно считать калории по фото, хочется больше домашних тренировок" oninput="rvDraftSet('text',this.value)">${esc(d.text)}</textarea></div>
   <div id="rvmsg" aria-live="polite"></div>
   <button class="btn" id="rvsend" onclick="rvSend()">Отправить отзыв</button>
   <div class="concept">В отзыве уходят только оценка, текст и имя, если укажете; сервер в России. Отзыв увидят все пользователи приложения.</div>`)}
function rvStar(i){S.rvDraft.stars=i;haptic(8);save();document.querySelectorAll('.starpick button').forEach((b,j)=>{b.classList.toggle('on',j<i);b.setAttribute('aria-checked',j+1===i);b.classList.remove('pop');if(j===i-1&&!RM){void b.offsetWidth;b.classList.add('pop')}});
  const c=$('#rvcap');if(c){c.textContent=RVCAP[i];c.style.color='var(--text)'}const m=$('#rvmsg');if(m)m.innerHTML='';rvPaint()}
function rvDraftSet(k,v){S.rvDraft[k]=v;if(k==='text'){const c=$('#rvcnt');if(c)c.textContent=v.length+' / 600'}clearTimeout(rvDraftSet.t);rvDraftSet.t=setTimeout(()=>{save();rvPaint()},400)}
const rvMsg=(t,ok)=>{const m=$('#rvmsg');if(m)m.innerHTML=`<div class="lock" style="background:${ok?'var(--ok-soft)':'var(--warn-soft)'}"><span style="color:${ok?'var(--ok-text)':'var(--warn-text)'}">${ic(ok?'check':'bell')}</span><div>${t}</div></div>`};
// ответы сервера на POST /reviews: {error:код} — для каждого кода понятный текст; черновик при этом не теряется
const RVERR={one_per_day:'<b>Можно один отзыв в сутки.</b> Этот сохранили черновиком — отправьте завтра.',
  too_many:'<b>Слишком много отзывов с этого телефона.</b> Попробуйте позже — черновик сохранён.',
  bad_words:'<b>Уберите грубые слова</b> — и отправьте ещё раз. Черновик сохранён.',
  no_links:'<b>Ссылки в отзыве нельзя.</b> Уберите адрес сайта и отправьте ещё раз.',
  bad_stars:'<b>Поставьте оценку</b> — от одной до пяти звёзд.',
  too_long:'<b>Слишком длинно.</b> Текст — до 600 знаков, имя — до 40.',
  empty_text:'<b>Напишите пару слов</b> — что понравилось или чего не хватает.',
  bad_did:'<b>Отзыв не ушёл из-за сбоя.</b> Нажмите «Отправить отзыв» ещё раз.'};
const RVLINK=/(https?:\/\/|www\.|\b[a-z0-9-]+\.(ru|com|net|org|рф|su|io|me|ly|app|site|online|info|biz)(?![a-zа-яё0-9]))/i;
async function rvSend(){const d=S.rvDraft,b=$('#rvsend');if(!d||rvSend.busy)return;
  if(!d.stars){rvMsg('Поставьте оценку — от одной до пяти звёзд.');haptic(20);return}
  const name=clean(d.name).slice(0,40),text=String(d.text||'').trim().slice(0,600);
  if(text.length<2){rvMsg(RVERR.empty_text);haptic(20);return}
  if(RVLINK.test(text)||RVLINK.test(name)){rvMsg(RVERR.no_links);haptic(20);return}
  if(!navigator.onLine){rvMsg('<b>Нет интернета — отзыв не ушёл.</b> Черновик сохранён на телефоне, отправьте, когда появится сеть.');toast('Нет интернета — сохранили черновик',true);return}
  rvSend.busy=1;if(b){b.disabled=true;b.textContent='Отправляем…'}
  const r=await api('/reviews',{did:S.did,name,stars:d.stars,text});rvSend.busy=0;
  if(r.ok){const id=String((r.data&&r.data.id)||'local-'+Date.now());S.rvMine=[...(S.rvMine||[]),id].slice(-20);
    S.rv={list:[{id,name,stars:d.stars,text,ts:Date.now(),mine:true},...rvList().filter(x=>x.id!==id)].slice(0,50),at:Date.now()};
    S.rvDraft=null;S.askedReview='done';save();haptic([10,40,10]);setTimeout(()=>rvLoad(true),1500);
    sheet('Спасибо!',`<div style="padding:8px 0 4px">${OK}</div><div class="title" style="text-align:center;margin-top:14px">Отзыв опубликован</div><div class="small muted" style="text-align:center;margin:6px 0 16px">Его уже видят другие пользователи — это помогает им решиться, а нам понять, что улучшить.</div>
      <div class="card list">${rvItem(S.rv.list[0])}</div><button class="btn" onclick="openReviews()">Все отзывы</button><button class="btn ghost" onclick="closeSheet()">Готово</button>`);
    rvPaint();rerender.dirty=1;return}
  if(b){b.disabled=false;b.textContent='Отправить отзыв'}
  const code=r.data&&typeof r.data.error==='string'?r.data.error:'';
  if(code==='bad_did'){S.did=newDid();save()} // номер устройства испорчен — сделали новый, со второй попытки уйдёт
  if(RVERR[code]&&(r.status===429||r.status===400||r.status===413||r.status===422)){rvMsg(RVERR[code]);return}
  if(r.status===429){rvMsg(RVERR.one_per_day);return}
  if(r.status===400||r.status===413||r.status===422){rvMsg('<b>Сервер не принял отзыв.</b> Проверьте текст — до 600 знаков — и попробуйте ещё раз.');return}
  if(r.offline){rvMsg('<b>Пропал интернет — отзыв не ушёл.</b> Черновик сохранён на телефоне, отправьте, когда появится сеть.');return}
  rvMsg('<b>Сервер отзывов пока не отвечает — отзыв не ушёл.</b> Черновик сохранён на телефоне, попробуйте позже.')}
// мягкая просьба оценить: на 3-й день или после 5-й записи еды, один раз — карточкой в ленте, не всплывающим окном
function rvAsk(){if(S.askedReview&&S.askedReview!==today0())return '';
  if(!S.askedReview){if((S.useDays||0)<3&&(S.entries||0)<5)return '';S.askedReview=today0();save()}
  return `<div class="card rv-ask"><div class="row" style="align-items:flex-start"><div class="ibox warn">${ic('star')}</div><div style="flex:1;min-width:0"><div style="font-weight:600">Как вам приложение?</div><div class="small muted" style="margin-top:2px">Пара слов поможет другим решиться, а нам — понять, что улучшить</div></div></div>
    <div class="rv-acts"><button class="btn sm" onclick="openReviewForm()">Оценить</button><button class="btn sec sm" onclick="rvAskOff()">Не сейчас</button></div></div>`}
function rvAskOff(){S.askedReview='done';save();haptic(5);rerender()}
window.addEventListener('online',()=>{visit();if(RV.st==='offline'||RV.st==='noserver')rvLoad(true)});
window.addEventListener('offline',()=>{if(RV.st!=='ok'||!rvList().length){RV.st='offline';rvPaint()}});

/* ---------- напоминания: пуш-уведомления, как в «Здоровье» на iPhone ----------
   Присылает сервер (утром и вечером, по цифрам дня). Без сервера выключатель честно остаётся выключенным.
   На сервер уходят только номер устройства, часовой пояс, время напоминаний и цифры дня: сколько осталось ккал и белка, была ли тренировка. */
const REMDEF={on:false,morning:'09:00',evening:'19:00',workout:true,food:true};
function remR(){const R=S.remind&&typeof S.remind==='object'?S.remind:(S.remind={});for(const k in REMDEF)if(R[k]===undefined)R[k]=REMDEF[k];return R} // тот же объект — изменения не теряются
const remPrefs=R=>({workout:R.workout!==false,food:R.food!==false,morning:R.morning||'09:00',evening:R.evening||'19:00'});
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&window.isSecureContext!==false;
// ios — нужно открыть с экрана «Домой»; no — браузер не умеет; denied — запрещено в настройках; ok — можно включать
function remEnv(){if(isIOS()&&!isStandalone())return 'ios';if(!pushOk())return 'no';if(Notification.permission==='denied')return 'denied';return 'ok'}
const REMST={busy:false,msg:null};
function b64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function sameKey(sub,key){try{const k=sub.options&&sub.options.applicationServerKey;if(!k)return false;const a=new Uint8Array(k);return a.length===key.length&&a.every((v,i)=>v===key[i])}catch(e){return false}}
const swReg=ms=>'serviceWorker' in navigator?Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),ms||5000))]).catch(()=>null):Promise.resolve(null);
function remSub(R){if(!R.on)return 'выключены';const p=remPrefs(R),w=[p.workout&&'тренировка',p.food&&'еда и белок'].filter(Boolean).join(', ');return `утром в ${p.morning}, вечером в ${p.evening}${w?' · '+w:''}`}
function remHowOn(){return isIOS()?'Откройте «Настройки» → «Уведомления» → «Мой тренер» и включите «Допуск уведомлений». Потом вернитесь сюда.'
  :/Android/i.test(navigator.userAgent)?'Нажмите на значок слева от адреса сайта → «Разрешения» → «Уведомления» → «Разрешить». Или «Настройки» телефона → «Приложения» → браузер → «Уведомления».'
  :'Нажмите на значок замка слева от адреса сайта и разрешите уведомления для этого сайта. Потом вернитесь сюда.'}
function remNote(){const m=REMST.msg;if(!m)return '';const ok=m[0]==='ok';
  return `<div class="lock" style="background:${ok?'var(--ok-soft)':'var(--warn-soft)'}"><span style="color:${ok?'var(--ok-text)':'var(--warn-text)'}">${ic(ok?'check':'bell')}</span><div>${m[1]}</div></div>`}
function remBody(){const R=remR(),env=remEnv(),p=remPrefs(R),dis=env!=='ok'&&!R.on;
  const sw=`<button class="toggle ${R.on?'on':''}${REMST.busy?' busy':''}" role="switch" aria-checked="${R.on}" aria-label="Напоминания" onclick="remToggle()" ${dis||REMST.busy?'disabled':''}></button>`;
  const ex=[['Пора на тренировку',`Сегодня «${esc(program().days[curDay()])}» — около 45 минут. Отметьте, когда сделаете.`,'19:00'],['Не хватает белка',`До нормы ещё ${u(Math.max(25,norm(S.profile).p-Math.round(eaten().p)),'г')} — творог или курица на ужин закроют.`,'сейчас']];
  let env1='';
  if(env==='ios')env1=`<div class="card"><div class="title" style="font-size:17px">Сначала — на экран «Домой»</div><div class="small muted" style="margin:4px 0 6px">На iPhone напоминания приходят, только если открыть приложение с экрана «Домой» (нужен iOS 16.4 или новее). Это бесплатно и займёт 10 секунд:</div>
    <div class="rem-steps"><div class="rem-st"><span class="num">1</span><div>Внизу Safari нажмите «Поделиться» ${ic('share')}</div></div><div class="rem-st"><span class="num">2</span><div>Выберите «На экран „Домой“» ${ic('addsq')}</div></div><div class="rem-st"><span class="num">3</span><div>Откройте «Мой тренер» со значка на экране «Домой» и включите напоминания здесь</div></div></div></div>`;
  else if(env==='no')env1=`<div class="lock" style="background:var(--warn-soft)"><span style="color:var(--warn-text)">${ic('bell')}</span><div><b>Этот браузер не умеет присылать напоминания.</b> ${isIOS()?'Нужен iOS 16.4 или новее — обновите iPhone в «Настройки» → «Основные» → «Обновление ПО».':'Откройте приложение в Chrome, Safari или Edge — настройки ниже сохранятся.'}</div></div>`;
  else if(env==='denied')env1=`<div class="lock" style="background:var(--warn-soft)"><span style="color:var(--warn-text)">${ic('bell')}</span><div><b>Уведомления для приложения запрещены.</b> ${remHowOn()}</div></div>`;
  return `<div class="ntf-stage" aria-hidden="true">${ex.map(([t,b,tm])=>`<div class="ntf"><img src="icon.png" alt=""><div style="flex:1;min-width:0"><div class="nh"><span>Мой тренер</span><span>${tm}</span></div><b>${t}</b><div class="nb">${b}</div></div></div>`).join('')}</div>
   ${env1}
   <div class="card"><div class="rem-row" style="box-shadow:none;padding:0"><div class="ibox primary">${ic('bell')}</div><div class="t">Напоминания<small id="remst">${REMST.busy?'Включаем…':R.on?'включены · '+remSub(R):'выключены'}</small></div>${sw}</div></div>
   <div id="remmsg" aria-live="polite">${remNote()}</div>
   <h2 style="margin-top:6px">Когда</h2>
   <div class="card"><label class="rem-row"><span class="t">Утром<small>план на день и что съесть на завтрак</small></span><input type="time" class="tin" value="${p.morning}" onchange="remPref('morning',this.value)" aria-label="Утреннее напоминание"></label>
    <label class="rem-row"><span class="t">Вечером<small>тренировка, если ещё не отмечена, и белок</small></span><input type="time" class="tin" value="${p.evening}" onchange="remPref('evening',this.value)" aria-label="Вечернее напоминание"></label></div>
   <h2 style="margin-top:6px">О чём напоминать</h2>
   <div class="card"><div class="rem-row"><span class="t">Тренировка<small>в дни по плану, если ещё не сделали</small></span><button class="toggle ${p.workout?'on':''}" role="switch" aria-checked="${p.workout}" aria-label="Тренировка" onclick="remPref('workout',${!p.workout})"></button></div>
    <div class="rem-row"><span class="t">Еда и белок<small>если не записали еду или недобрали белок</small></span><button class="toggle ${p.food?'on':''}" role="switch" aria-checked="${p.food}" aria-label="Еда и белок" onclick="remPref('food',${!p.food})"></button></div></div>
   <div class="concept">Для напоминаний на сервер уходят только номер устройства и цифры дня (сколько осталось ккал и белка, была ли тренировка); сервер в России. Без имени, веса и фото.<br>Не медицинская консультация.</div>`}
function openRemind(){REMST.msg=null;if(!S.hlRemOff){S.hlRemOff=1;save();rerender.dirty=1}sheet('Напоминания',`<div id="remall">${remBody()}</div>`);remCheck().then(ch=>{if(ch)remPaint()})}
function remPaint(){const b=$('#remall');if(b){const y=$('#sbody').scrollTop;b.innerHTML=remBody();$('#sbody').scrollTop=y}rerender.dirty=1}
const remSay=(k,t)=>{REMST.msg=[k,t];remPaint()};
async function remToggle(){if(REMST.busy)return;haptic(8);if(remR().on)return remOff();return remOn()}
async function remOn(){const R=remR(),env=remEnv();if(env!=='ok'){remPaint();return}
  REMST.busy=true;REMST.msg=null;remPaint();
  const done=(k,t)=>{REMST.busy=false;if(t)REMST.msg=[k,t];remPaint()};
  let perm=Notification.permission;
  if(perm!=='granted'){try{perm=await new Promise(res=>{const q=Notification.requestPermission(res);if(q&&q.then)q.then(res,()=>res('default'))})}catch(e){perm='default'}}
  if(perm==='denied')return done('warn','<b>Вы запретили уведомления.</b> '+remHowOn());
  if(perm!=='granted')return done('warn','<b>Уведомления не разрешены.</b> Нажмите на выключатель ещё раз и выберите «Разрешить».');
  if(!navigator.onLine)return done('warn','<b>Нет интернета.</b> Напоминания включатся, когда появится сеть — нажмите ещё раз.');
  const k=await api('/push/key'),key=k.ok&&k.data&&k.data.publicKey;
  if(!key)return done('warn',k.offline?'<b>Пропал интернет.</b> Попробуйте ещё раз, когда появится сеть.':'<b>Напоминания заработают, когда подключим сервер.</b> Настройки сохранили — включите чуть позже.');
  const reg=await swReg(6000);if(!reg||!reg.pushManager)return done('warn','<b>Приложение ещё готовится.</b> Закройте и откройте его снова, потом включите напоминания.');
  let sub=null;
  try{const kb=b64u(key);sub=await reg.pushManager.getSubscription();if(sub&&!sameKey(sub,kb)){await sub.unsubscribe().catch(()=>{});sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:kb})}
  catch(e){console.warn('Подписка на напоминания:',(e&&e.name)||e);return done('warn','<b>Телефон не дал подписаться на напоминания.</b> Попробуйте ещё раз чуть позже.')}
  const r=await api('/push/subscribe',{did:S.did,sub:sub.toJSON(),tz:tzName(),prefs:remPrefs(R)});
  if(!r.ok){try{await sub.unsubscribe()}catch(e){}return done('warn',r.offline?'<b>Пропал интернет.</b> Попробуйте ещё раз, когда появится сеть.':'<b>Напоминания заработают, когда подключим сервер.</b> Настройки сохранили — включите чуть позже.')}
  R.on=true;R.sig='';R.stAt=0;R.dirty=false;R.unsub=false;R.tz=tzName();save();haptic([10,40,10]);
  done('ok',`<b>Напоминания включены.</b> Утром в ${remPrefs(R).morning} и вечером в ${remPrefs(R).evening} — только если есть что напомнить.`);
  toast('Напоминания включены');setTimeout(pushTick,300)}
async function remOff(){const R=remR();R.on=false;R.unsub=true;REMST.msg=null;save();remPaint();toast('Напоминания выключены');
  await remDrop();remUnsub()}
async function remDrop(){try{const reg=await swReg(3000),sub=reg&&reg.pushManager&&await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){console.warn('Отписка:',(e&&e.name)||e)}}
async function remUnsub(){const R=remR();if(!R.unsub||!navigator.onLine)return;const r=await api('/push/unsubscribe',{did:S.did});if(r.ok){R.unsub=false;save()}} // не дошло — повторим при следующем запуске
function remPref(k,v){const R=remR();if((k==='morning'||k==='evening')&&!/^\d\d:\d\d$/.test(v||''))return remPaint();R[k]=v;haptic(5);
  if(R.on){R.dirty=true;clearTimeout(remPref.t);remPref.t=setTimeout(remResend,800)}save();remPaint()}
async function remResend(){const R=remR();if(!R.on||!R.dirty||!navigator.onLine)return;
  const reg=await swReg(3000),sub=reg&&reg.pushManager&&await reg.pushManager.getSubscription().catch(()=>null);if(!sub)return;
  const r=await api('/push/subscribe',{did:S.did,sub:sub.toJSON(),tz:tzName(),prefs:remPrefs(R)});if(r.ok){R.dirty=false;save()}}
// выключатель не врёт: если разрешение забрали в настройках или подписка пропала — показываем «выключены»
async function remCheck(){const R=remR();if(!R.on)return false;
  if(!pushOk()||Notification.permission!=='granted'){R.on=false;R.unsub=true;save();return true}
  const reg=await swReg(4000);if(!reg||!reg.pushManager)return false;
  const sub=await reg.pushManager.getSubscription().catch(()=>null);if(!sub){R.on=false;R.unsub=true;save();return true}return false}
async function remSync(){try{const R=remR();if(await remCheck())rerender.dirty=1;if(R.unsub)remUnsub();else if(R.on){if(R.dirty||R.tz!==tzName()){R.tz=tzName();R.dirty=true;remResend()}pushTick()}}catch(e){console.warn('Напоминания:',e)}}
// цифры дня для сервера: при изменениях дневника и тренировки, не чаще раза в 2 минуты и только при включённых напоминаниях
function pushSoon(){if(!(S&&S.remind&&S.remind.on)||S.onb)return;clearTimeout(pushSoon.t);pushSoon.t=setTimeout(pushTick,2000)}
function pushState(){const n=norm(S.profile),e=eaten(),wd=(new Date().getDay()+6)%7,done=doneToday(),plan=S.plan||planWeek();
  return {date:today0(),kcal_left:Math.round(n.kcal-e.k),protein_left_g:Math.max(0,n.p-Math.round(e.p)),workout_today:done||(plan.includes(wd)&&!restDay()&&!weekFull()),workout_done:done,reviewed:!!(S.rvMine&&S.rvMine.length)}}
function pushTick(){const R=S.remind;if(!R||!R.on||S.onb||!S.profile||pushTick.busy)return;let st;try{st=pushState()}catch(e){return}
  const sig=JSON.stringify(st);if(sig===R.sig)return;
  const wait=2*60e3-(Date.now()-(R.stAt||0));clearTimeout(pushTick.t);if(wait>0){pushTick.t=setTimeout(pushTick,wait+300);return}
  if(!navigator.onLine)return;pushTick.busy=1;R.stAt=Date.now();
  api('/push/state',{did:S.did,...st}).then(r=>{pushTick.busy=0;if(r.ok){R.sig=sig;save()}else{clearTimeout(pushTick.t);pushTick.t=setTimeout(pushTick,2*60e3+300)}})}
// нажали на напоминание: адрес вида ./#gym или ./#food открывает нужный экран
function openHash(h){h=String(h||'').replace(/^#/,'');if(!h||S.onb)return;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  const m={gym:openProgram,food:openFoodPlan,scan:openScan,weight:openWeight,remind:openRemind,reviews:openReviews,review:()=>openReviewForm()};
  if(m[h])setTimeout(m[h],350);else if(['today','tech','me'].includes(h)){closeSheet();go(h)}}
if('serviceWorker' in navigator)try{navigator.serviceWorker.addEventListener('message',e=>{const o=e.data&&e.data.open;if(o)try{openHash(new URL(o,location.href).hash)}catch(_){}})}catch(e){}
window.addEventListener('online',()=>{if(S.remind&&(S.remind.on||S.remind.unsub))remSync()});

/* ---------- старт ---------- */
if(S.onb)showOnb();else $('#onb').classList.add('hide');
if(!S.onb&&!consentOk()&&S.consentAsked!==LEGAL_V)setTimeout(()=>consentOpen('existing'),1500); // прошли анкету до окна согласия — спросим один раз, ничего не блокируя
render();
setTimeout(visit,1500);setTimeout(remSync,2500);openHash(location.hash);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){visit();if(!S.onb&&S.tab==='today')rvLoad();if(S.remind&&(S.remind.on||S.remind.unsub))remSync()}});
</script>
</body>
