}

/* ---------- База продуктов и блюд: поиск и расчёт кодом ---------- */
let DB=null,DBI=null; // DB.products (массив), DB.dishes (массив), DBI — индекс по названию
const norm_=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9%,. ]/g,' ').replace(/\s+/g,' ').trim();
async function loadDB(){
  if(DB)return DB;
  try{const [pr,ds,al]=await Promise.all([fetch('data/products.json').then(r=>r.json()),fetch('data/dishes.json').then(r=>r.json()),fetch('data/aliases.json').then(r=>r.json()).catch(()=>({}))]);
    DB={products:pr,dishes:ds};DBI={};pr.forEach(x=>{P[x.id]={n:x.n,p:x.p,f:x.f,c:x.c};DBI[norm_(x.n)]=x.id});Object.entries(al).forEach(([n,id])=>{if(!DBI[norm_(n)])DBI[norm_(n)]=id}); // алиасы: имя из рецепта -> id продукта
    (S.custom||[]).forEach(x=>{if(!pr.find(p=>p.id===x.id))pr.push(x)});
  }catch(e){DB={products:[],dishes:[]};DBI={}}
  return DB;
}
function findProduct(name){const k=norm_(name);if(DBI[k])return DBI[k];const hit=Object.keys(DBI).find(n=>n.startsWith(k)||k.startsWith(n));return hit?DBI[hit]:null}
function searchDB(q){
  const k=norm_(q);if(!k)return{products:[],dishes:[]};const words=k.split(' ');
  const score=n=>{const s=norm_(n);if(s===k)return 3;if(s.startsWith(k))return 2;return words.every(w=>s.includes(w))?1:0};
  const products=DB.products.map(x=>[score(x.n),x]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]||a[1].n.length-b[1].n.length).slice(0,20).map(a=>a[1]);
  const dishes=DB.dishes.map(x=>[score(x.n),x]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]).slice(0,10).map(a=>a[1]);
  return{products,dishes};
}

   <div id="qres"><div class="card small muted">Загружаем базу…</div></div>`);

}

const OFF_FIELDS='code,product_name,product_name_ru,brands,nutriments,quantity,image_small_url,serving_size';
function offToProduct(pr){const n=pr.nutriments||{},num=v=>v==null||v===''?null:+v;const p=num(n.proteins_100g)||0,f=num(n.fat_100g)||0,c=num(n.carbohydrates_100g)||0;let kcal=num(n['energy-kcal_100g']);if(kcal==null&&n.energy_100g)kcal=Math.round(n.energy_100g/4.184);if(kcal==null)kcal=Math.round(p*4+f*9+c*4);
  const name=(pr.product_name_ru||pr.product_name||'Без названия').trim(),brand=(pr.brands||'').split(',')[0].trim();
  const qm=/(\d+(?:[.,]\d+)?)\s*(г|g|гр|мл|ml)\b/i.exec(pr.quantity||''),qg=qm?Math.round(parseFloat(qm[1].replace(',','.'))):0;
  return {id:'off_'+pr.code,n:brand&&!name.toLowerCase().includes(brand.toLowerCase())?name+' · '+brand:name,cat:'мировая база',p,f,c,kcal,portion:qg>0&&qg<=600?{g:qg,name:'упаковка '+pr.quantity}:{g:100,name:'100 г'},src:'Open Food Facts, этикетка производителя · код '+pr.code,img:pr.image_small_url||'',code:pr.code,qty:pr.quantity||''}}
async function offProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}?fields=${OFF_FIELDS}`);if(!r.ok)throw new Error('сервер базы не отвечает');
  const j=await r.json();if(j.status!==1||!j.product)return null;return offToProduct(j.product);
}
async function offSearch(q){
  const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${OFF_FIELDS}`;
  const r=await fetch(url);if(!r.ok)throw new Error('503');const j=await r.json();return (j.products||[]).filter(x=>x.nutriments&&(x.nutriments['energy-kcal_100g']!=null||x.nutriments.proteins_100g!=null)).map(offToProduct);
}
function useOff(x){await0=null;if(!DB)DB={products:[],dishes:[]};if(!DB.products.find(p=>p.id===x.id))DB.products.push(x);productPortion(x.id,x.portion&&x.portion.g>0&&x.portion.g<=400?x.portion.g:100)}

let FV={ex:'squat',file:null};
function openForm(){
  sheet('Разбор техники по видео',`<div class="card small muted">Снимите себя сбоку, целиком в кадре, 2–5 повторов. Телефон разберёт движение сам, без отправки видео на сервер: точки суставов, углы, повторы. Это подсказка по технике, не медицинская консультация.</div>

function formFile(inp){const f=inp.files&&inp.files[0];if(!f)return;formRun(URL.createObjectURL(f),FV.ex)}
const angle=(a,b,c)=>{const v1=[a.x-b.x,a.y-b.y],v2=[c.x-b.x,c.y-b.y];const d=v1[0]*v2[0]+v1[1]*v2[1],m=Math.hypot(...v1)*Math.hypot(...v2)||1;return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI};
const EDGES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
let POSE=null;
async function loadPose(){
  if(POSE)return POSE;
  const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const vision=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  POSE=await m.PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
  return POSE;
}
async function formRun(src,ex){
  FV.ex=ex;const f=FORM[ex];
  sheet('Разбираем…',`<div class="plate" style="background:#111"><video id="fv" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video><canvas id="fc" style="position:absolute;inset:0;width:100%;height:100%;z-index:2"></canvas></div>
   <div class="card" style="margin-top:12px"><div class="row between"><span class="small muted" id="fstat">Загружаем модель…</span><span class="num" id="fpct">0%</span></div><div class="bar" style="margin-top:8px"><i id="fbar" style="width:0;background:var(--accent)"></i></div></div>`);
  const v=$('#fv'),c=$('#fc'),ctx=c.getContext('2d');
  try{
    const pl=await loadPose();v.src=src;await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j(new Error('видео не читается'));v.load()});
    c.width=v.videoWidth;c.height=v.videoHeight;const dur=Math.min(v.duration||0,20),step=1/10,S2=[];
    $('#fstat').textContent='Ищем суставы…';
    for(let t=0;t<dur;t+=step){await seekTo(v,t);const r=pl.detectForVideo(v,Math.round(t*1000));const lm=r.landmarks&&r.landmarks[0];
      if(lm)S2.push({t,lm:lm.map(p=>({x:p.x,y:p.y,v:p.visibility}))});
      const pct=Math.round(t/dur*100);$('#fpct').textContent=pct+'%';$('#fbar').style.width=pct+'%';
      if(lm){ctx.clearRect(0,0,c.width,c.height);drawSkel(ctx,lm,c.width,c.height)}}
    if(S2.length<10)throw new Error('человек не найден в кадре — снимите целиком, сбоку, при хорошем свете');
    formResult(src,ex,S2,v);
  }catch(e){sheet('Не получилось',`<div class="card">${e.message}</div><button class="btn" onclick="openForm()">Попробовать ещё</button>`)}
}
function drawSkel(ctx,lm,W,H,col='#FF4F45'){ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,W/160);ctx.lineCap='round';EDGES.forEach(([a,b])=>{if(lm[a].v<.4||lm[b].v<.4)return;ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke()});ctx.fillStyle='#fff';lm.slice(11,29).forEach(p=>{if(p.v<.4)return;ctx.beginPath();ctx.arc(p.x*W,p.y*H,Math.max(3,W/120),0,7);ctx.fill()})}
function analyze(ex,S2){
  const kneeL=S2.map(s=>angle(s.lm[23],s.lm[25],s.lm[27])),kneeR=S2.map(s=>angle(s.lm[24],s.lm[26],s.lm[28]));
  const knee=kneeL.map((a,i)=>Math.min(a,kneeR[i])),hip=S2.map(s=>Math.min(angle(s.lm[11],s.lm[23],s.lm[25]),angle(s.lm[12],s.lm[24],s.lm[26])));
  const elbow=S2.map(s=>Math.min(angle(s.lm[11],s.lm[13],s.lm[15]),angle(s.lm[12],s.lm[14],s.lm[16])));
  const torso=S2.map(s=>{const sh={x:(s.lm[11].x+s.lm[12].x)/2,y:(s.lm[11].y+s.lm[12].y)/2},hp={x:(s.lm[23].x+s.lm[24].x)/2,y:(s.lm[23].y+s.lm[24].y)/2};return Math.abs(Math.atan2(sh.x-hp.x,hp.y-sh.y)*180/Math.PI)});
  const sig=ex==='pushup'?elbow:ex==='press'?elbow.map(a=>180-a):knee; // что считаем «движением»
  // повторы: минимумы сигнала ниже порога
  const reps=[];let inRep=false,start=0,minI=0;const hi=Math.max(...sig),lo=Math.min(...sig),thr=lo+(hi-lo)*.4;
  if(hi-lo>=25)sig.forEach((a,i)=>{if(!inRep&&a<thr){inRep=true;start=i;minI=i}else if(inRep){if(a<sig[minI])minI=i;if(a>=thr+(hi-lo)*.2){if(i-start>=4)reps.push({start,bottom:minI,end:i});inRep=false}}}); // амплитуда меньше 25° или короче 0,4 с — не движение
  const findings=[],good=[];let score=100;
  const bottoms=reps.map(r=>r.bottom);
  const ratios=S2.map(s=>Math.abs(s.lm[11].x-s.lm[12].x)/(Math.abs((s.lm[11].y+s.lm[12].y)/2-(s.lm[23].y+s.lm[24].y)/2)||.01)).sort((a,b)=>a-b),frontal=ratios[Math.floor(ratios.length/2)]>.85; // вид спереди: плечи шире длины корпуса
  const side=!frontal;
  if(ex==='squat'||ex==='lunge'){
    const depth=bottoms.length?Math.min(...bottoms.map(i=>knee[i])):Math.min(...knee);
    if(depth>110){findings.push({j:['колено'],k:'Недостаточная глубина',d:`В нижней точке угол в колене ${Math.round(depth)}°: бедро не доходит до параллели. Садитесь ниже, если позволяют колени.`,at:bottoms[0]});score-=25}else good.push('Глубина приседа достаточная');
    const lean=bottoms.length?Math.max(...bottoms.map(i=>torso[i])):Math.max(...torso);
    if(side){if(lean>60){findings.push({j:['таз'],k:'Сильный наклон корпуса',d:`Корпус наклонён на ${Math.round(lean)}° в нижней точке — нагрузка уходит на поясницу. Держите грудь выше, вес на пятках.`,at:bottoms.find(i=>torso[i]>60)});score-=20}else good.push('Корпус держите ровно')}
    const valgus=frontal?bottoms.filter(i=>{const l=S2[i].lm;const w=Math.abs(l[27].x-l[28].x)||.01;return Math.abs(l[25].x-l[26].x)<w*.75}):[];
    if(valgus.length){findings.push({j:['колено'],k:'Колени уходят внутрь',d:'В нижней точке колени ближе друг к другу, чем стопы. Разводите колени в стороны носков — так безопаснее для связок.',at:valgus[0]});score-=25}else if(frontal)good.push('Колени идут за носками');
    if(frontal)good.push('Снято спереди: глубину и наклон корпуса точнее видно сбоку');
    const asym=bottoms.length?Math.max(...bottoms.map(i=>Math.abs(kneeL[i]-kneeR[i]))):0;
    if(asym>15){findings.push({k:'Перекос на одну ногу',d:`Разница углов в коленях ${Math.round(asym)}°. Распределяйте вес на обе ноги поровну.`,at:bottoms[0]});score-=10}
  }
  if(ex==='pushup'){
    const depth=bottoms.length?Math.min(...bottoms.map(i=>elbow[i])):Math.min(...elbow);
    if(depth>100){findings.push({j:['локоть'],k:'Неполная амплитуда',d:`Локоть сгибается только до ${Math.round(depth)}°. Опускайтесь, пока грудь почти не коснётся пола.`,at:bottoms[0]});score-=25}else good.push('Амплитуда полная');
    const sag=Math.max(...S2.map(s=>Math.abs(angle(s.lm[11],s.lm[23],s.lm[25])-180)));
    if(sag>25){findings.push({j:['таз'],k:'Провисает поясница',d:'Таз ниже линии плечи — пятки. Напрягите пресс и ягодицы, тело должно быть одной линией.',at:0});score-=20}else good.push('Тело держите одной линией');
  }
  if(ex==='plank'){
    const sag=S2.map(s=>Math.abs(angle(s.lm[11],s.lm[23],s.lm[25])-180)),worst=sag.indexOf(Math.max(...sag));
    if(sag[worst]>20){findings.push({j:['таз'],k:'Таз провисает или задран',d:`Отклонение от прямой линии ${Math.round(sag[worst])}°. Подкрутите таз, напрягите пресс.`,at:worst});score-=30}else good.push('Линия тела прямая');
  }
  if(ex==='deadlift'){
    const lean=Math.max(...torso);if(lean<40){findings.push({j:['таз'],k:'Мало наклона',d:'Таз почти не уходит назад — работают колени, а не задняя поверхность бедра. Наклоняйтесь глубже, отводя таз.',at:torso.indexOf(lean)});score-=20}else good.push('Таз уходит назад, наклон есть');
    const kneeMin=Math.min(...knee);if(kneeMin<100){findings.push({j:['колено'],k:'Сильно сгибаете колени',d:`Колено сгибается до ${Math.round(kneeMin)}° — это присед, а не тяга. Колени чуть согнуты, движение в тазу.`,at:knee.indexOf(kneeMin)});score-=20}
  }
  if(ex==='press'){
    const lean=Math.max(...torso);if(lean>12){findings.push({j:['таз'],k:'Прогиб в пояснице',d:`Корпус отклоняется на ${Math.round(lean)}°. Напрягите пресс, не подталкивайте гантели корпусом.`,at:torso.indexOf(lean)});score-=20}else good.push('Корпус стабилен');
    const top=Math.max(...elbow);if(top<160){findings.push({j:['локоть'],k:'Не дожимаете вверх',d:`Локоть распрямляется только до ${Math.round(top)}°. Выжимайте до полного выпрямления.`,at:elbow.indexOf(top)});score-=15}
  }
  if(!reps.length&&ex!=='plank'){findings.push({k:'Повторы не распознаны',d:'Не нашли ни одного полного движения: снимите сбоку, чтобы были видны колени и таз, 2–5 повторов.',at:0});score-=30}
  const tempo=reps.length?reps.map(r=>((r.end-r.start)*0.1).toFixed(1)):[];
  return {reps:reps.length,repList:reps,findings,good,score:Math.max(0,score),tempo,frontal,bottomIdx:bottoms[0]??Math.floor(S2.length/2),knee,hip,elbow,torso};
}
// Слои атласа мышц: img/anat/base.png (весь атлас, в приложении серый) + слой на каждую группу (вырезан из того же SVG, Wikimedia Commons CC BY-SA 4.0)
const MUSMAP={quads:[['quads'],['adductors']],glutes:[['glutes'],[]],hams:[['hams'],['calves']],core:[['abs','obliques'],['lowerback']],chest:[['chest'],[]],triceps:[['triceps'],[]],shoulders:[['shoulders'],['traps']],back:[['back','lowerback'],['traps']],calves:[['calves'],[]],biceps:[['biceps'],[]]};
const MUSNAME={quads:'Квадрицепсы',adductors:'Приводящие бедра',glutes:'Ягодичные',hams:'Задняя поверхность бедра',calves:'Икры',abs:'Пресс',obliques:'Косые живота',lowerback:'Поясница',chest:'Грудные',triceps:'Трицепсы',biceps:'Бицепсы',shoulders:'Дельты (плечи)',traps:'Трапеции',back:'Широчайшие и лопатки',shins:'Голень спереди'};
function muscleLevels(on){const lv={};on.forEach((m,i)=>{const [pr,hl]=MUSMAP[m]||[[],[]];pr.forEach(g=>lv[g]=Math.min(lv[g]||9,i<2?1:2));hl.forEach(g=>lv[g]=Math.min(lv[g]||9,2))});return lv}
function muscleMap(on){
  const lv=muscleLevels(on),gs=Object.keys(lv).sort((a,b)=>lv[a]-lv[b]);
  return `<div class="anat"><img class="base" src="img/anat/base.png" alt="Атлас мышц: вид спереди и сзади" loading="lazy">${gs.map(g=>`<img class="ly ${lv[g]===2?'s':''}" src="img/anat/${g}.png" alt="" loading="lazy">`).join('')}<span class="lbl l">спереди</span><span class="lbl r">сзади</span></div>
   <div class="legend"><span><i style="background:#FF3B30"></i>Основная нагрузка</span><span><i style="background:#FF9F0A"></i>Помогают</span></div>
   <div class="mlist">${gs.map(g=>`<div><i style="background:${lv[g]===1?'#FF3B30':'#FF9F0A'}"></i>${MUSNAME[g]}<small>${lv[g]===1?'основная':'помогает'}</small></div>`).join('')}</div>`;
}
// Углы в суставах на кадре пользователя: дуга + подпись у ключевых суставов упражнения
const JOINTS={squat:[['колено',23,25,27,24,26,28],['таз',11,23,25,12,24,26]],lunge:[['колено',23,25,27,24,26,28]],pushup:[['локоть',11,13,15,12,14,16],['таз',11,23,25,12,24,26]],plank:[['таз',11,23,25,12,24,26]],deadlift:[['таз',11,23,25,12,24,26],['колено',23,25,27,24,26,28]],press:[['локоть',11,13,15,12,14,16]]};
function drawAngles(ctx,lm,W,H,ex,bad){
  const list=JOINTS[ex]||[];const f=Math.max(11,Math.round(W/26));ctx.font=`700 ${f}px -apple-system,Inter,system-ui,sans-serif`;ctx.textBaseline='middle';
  list.forEach(([name,a,b,c,a2,b2,c2])=>{
    const left=(lm[a].v+lm[b].v+lm[c].v)>=(lm[a2].v+lm[b2].v+lm[c2].v);const [i,j,k]=left?[a,b,c]:[a2,b2,c2];if(lm[j].v<.4)return;

    const a1=Math.atan2(lm[i].y*H-by,lm[i].x*W-bx),a3=Math.atan2(lm[k].y*H-by,lm[k].x*W-bx);let d=a3-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    const isBad=bad&&bad.includes(name),col=isBad?'#FF3B30':'#FFD60A';
    ctx.beginPath();ctx.moveTo(bx,by);ctx.arc(bx,by,r,a1,a1+d,d<0);ctx.closePath();ctx.fillStyle=isBad?'rgba(255,59,48,.35)':'rgba(255,214,10,.3)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,W/240);ctx.stroke();
    if(W<380)return;const txt=`${name} ${Math.round(ang)}°`,tw=ctx.measureText(txt).width,pad=f*.5,bw=tw+pad*2,bh=f*1.6;let tx=bx+r*1.1,ty=by-r*.9;if(tx+bw>W-4)tx=bx-r*1.1-bw;if(ty-bh/2<4)ty=by+r*.9;
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.roundRect(tx,ty-bh/2,bw,bh,bh/2);ctx.fill();ctx.fillStyle=col;ctx.fillText(txt,tx+pad,ty+1);
  });
}
// Кадр с человеком крупно: обрезаем видео по точкам тела с запасом, чтобы углы и скелет были читаемы
function bodyCrop(lm,vw,vh){const pts=lm.filter(p=>p.v>.4);if(pts.length<6)return{x:0,y:0,w:vw,h:vh};
  let x0=Math.min(...pts.map(p=>p.x))*vw,x1=Math.max(...pts.map(p=>p.x))*vw,y0=Math.min(...pts.map(p=>p.y))*vh,y1=Math.max(...pts.map(p=>p.y))*vh;
  const px=(x1-x0)*.28+vw*.02,py=(y1-y0)*.14+vh*.02;x0-=px;x1+=px;y0-=py*1.4;y1+=py; // сверху запас больше: голова
  let w=x1-x0,h=y1-y0,ar=w/h;if(ar<.8){const nw=h*.8;x0-=(nw-w)/2;w=nw}if(ar>1.45){const nh=w/1.45;y0-=(nh-h)/2;h=nh}
  w=Math.min(w,vw);h=Math.min(h,vh);x0=Math.max(0,Math.min(x0,vw-w));y0=Math.max(0,Math.min(y0,vh-h));return{x:x0,y:y0,w,h}}
function frameShot(v,lm,ex,col,w=420,bad){const cr=bodyCrop(lm,v.videoWidth,v.videoHeight),c=document.createElement('canvas');const k=w/cr.w;c.width=w;c.height=Math.round(cr.h*k);const ctx=c.getContext('2d');ctx.drawImage(v,cr.x,cr.y,cr.w,cr.h,0,0,c.width,c.height);
  const lm2=lm.map(p=>({x:(p.x*v.videoWidth-cr.x)/cr.w,y:(p.y*v.videoHeight-cr.y)/cr.h,v:p.v}));drawSkel(ctx,lm2,c.width,c.height,col);if(ex)drawAngles(ctx,lm2,c.width,c.height,ex,bad);return{src:c.toDataURL('image/jpeg',.82),ar:c.width/c.height}}
async function seekTo(v,t){ // ждём не только seeked, но и реально отрисованный кадр (иначе в фоне все кадры одинаковые)
  await new Promise(r=>{if(Math.abs(v.currentTime-t)<1e-3&&v.readyState>=2)return r();v.onseeked=r;v.currentTime=t});
  if('requestVideoFrameCallback' in v)await new Promise(r=>{const id=v.requestVideoFrameCallback(()=>r());setTimeout(r,120)});
}
function phaseFrames(a,S2){const r=a.repList&&a.repList[0];if(r)return{start:r.start,down:Math.round((r.start+r.bottom)/2),bottom:r.bottom,up:Math.round((r.bottom+r.end)/2)};const n=S2.length;return{start:0,down:Math.round(n*.3),bottom:Math.round(n*.5),up:Math.round(n*.75)}}
function phaseMetric(ex,a,i){const d=x=>Math.round(x)+'°';
  if(ex==='squat'||ex==='lunge')return{v:d(a.knee[i]),t:'цель ≤ 100°',ok:a.knee[i]<=100,n:'колено'};
  if(ex==='pushup')return{v:d(a.elbow[i]),t:'цель ≤ 90°',ok:a.elbow[i]<=90,n:'локоть'};
  if(ex==='plank'){const s=Math.abs(a.hip[i]-180);return{v:d(s),t:'цель ≤ 10°',ok:s<=10,n:'прогиб'}}
  if(ex==='deadlift')return{v:d(a.torso[i]),t:'цель 45–70°',ok:a.torso[i]>=45&&a.torso[i]<=70,n:'наклон'};
  if(ex==='press')return{v:d(a.elbow[i]),t:'цель ≥ 165°',ok:a.elbow[i]>=165,n:'локоть'};return null}

const LOAD=[8,12,18,26,30,28,24,22,26,34,48,72,86,80,58,36,18];
function clubLoad(){const c=club(),k=0.8+([...c.id].reduce((s,ch)=>s+ch.charCodeAt(0),0)%5)*0.08;return LOAD.map(v=>Math.min(98,Math.round(v*k)))}
function loadNow(){const h=new Date().getHours();return h<7||h>23?5:clubLoad()[h-7]}
function bestHour(){const L=clubLoad(),h=Math.max(new Date().getHours()+1,7);if(h>22)return 10;let best=h,v=999;for(let x=h;x<=22;x++){if(L[x-7]<v){v=L[x-7];best=x}}return best}

       <div class="chips" style="margin-top:6px">${[[.2,'20%'],[.3,'30%'],[.4,'40%']].map(([v,l])=>`<button class="chip ${D.share===v?'on':''}" onclick="D.share=${v};renderOnb()">${l}</button>`).join('')}</div></div>
      <div class="card row"><div class="ibox" style="background:rgba(31,181,126,.14);color:var(--ok)">${ic('wallet')}</div><div style="flex:1"><div class="small muted">Бюджет на еду</div><div class="num" style="font-size:26px" id="budv">${fmt(bud)} ₽ в день</div><div class="small muted" id="stv">${stores(bud).map(s=>s[0]).join(', ')}</div></div></div></div>
      <button class="btn" style="margin-top:12px" onclick="obNext()">Дальше</button>`,
   ()=>`<div class="q">Где тренируетесь?</div><div class="qs">Программа подстроится под инвентарь</div>
      ${[['gym','В зале','тренажёры, штанга, гантели','gym'],['home','Дома','без инвентаря или с гантелями','home'],['both','И там, и там','программа на оба случая','run']].map(([k,t,d,i])=>`<button class="opt ${D.place===k?'on':''}" onclick="D.place='${k}';renderOnb()"><div class="ibox">${ic(i)}</div><div style="flex:1"><div style="font-weight:700">${t}</div><div class="small muted">${d}</div></div></button>`).join('')}
      <div style="flex:1"></div><button class="btn" onclick="obNext()">Дальше</button>`,
   ()=>`<div class="q">Ваш план готов</div><div class="qs">Посчитано по вашим данным — формулами, а не нейросетью</div>
      <div style="overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">
      <div class="hero" style="text-align:center"><div style="font-size:13px;opacity:.9">Суточная норма</div><div class="num" style="font-size:52px;line-height:1.05">${CU(nr.kcal)}</div><div style="font-size:14px;opacity:.9">ккал · Б ${nr.p} · Ж ${nr.f} · У ${nr.c}</div></div>
      ${calcCard(D)}
      <div class="grid2" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="small muted">Еда в день</div><div class="num" style="font-size:24px">${fmt(bud)} ₽</div><div class="small muted">${stores(bud).map(s=>s[0]).slice(0,2).join(', ')}</div></div>
       <div class="card" style="margin:0"><div class="small muted">Программа</div><div class="num" style="font-size:19px">${GOALS[D.goal].prog}</div><div class="small muted">${pl(D.trains,'раз','раза','раз')} в неделю · ${{gym:'в зале',home:'дома',both:'дома и в зале'}[D.place||'both']}</div></div></div>
      ${SOURCES}</div>
      <button class="btn" style="margin-top:12px" onclick="obFinish()">Начать</button>`
  ];
  const pct=OB/(STEPS-1)*100;
  $('#onb').innerHTML=`<div class="back row between">${OB>0?`<span onclick="obBack()" style="cursor:pointer">‹ Назад</span><span class="tiny muted">${OB} из ${STEPS-1}</span>`:''}</div>${OB>0?`<div class="prog"><i style="width:${obDir?obPct:pct}%" data-w="${pct}%"></i></div>`:''}<div class="${obDir?'stg '+obDir:''}" style="flex:1;display:flex;flex-direction:column;min-height:0">${steps[OB]()}</div>`;
  after($('#onb'),!!obDir&&!RM,true);obDir='';obPct=pct;
}
function updBud(){const b=budgetOf(D);const a=$('#incv'),bv=$('#budv'),sv=$('#stv');if(a)a.textContent=fmt(D.income)+' ₽';if(bv)bv.textContent=fmt(b)+' ₽ в день';if(sv)sv.textContent=stores(b).map(s=>s[0]).join(', ')}
function obAdj(k,d,mn,mx){D[k]=Math.max(mn,Math.min(mx,D[k]+d));haptic(4);renderOnb()}
function obNext(){obDir='sl';OB=Math.min(OB+1,STEPS-1);haptic(8);renderOnb()}
function obBack(){obDir='sr';OB=Math.max(0,OB-1);haptic(5);renderOnb()}
function obDemo(){D={...DEMO};obFinish(true)}
function obFinish(demo){const p={...D};delete p._geo;p.name=(p.name||'').trim()||'Вы';S.profile=p;S.demo=!!demo;S.onb=false;S.done=demo?[0]:[];S.sets={};S.log=[];S.weights=[];S.forms=[];S.extra=[];S.workouts=0;S.lastForm=null;if(demo)seedDay();save();$('#onb').classList.add('hide');haptic([10,40,10]);DIR='';render();toTop();setTimeout(()=>toast('План «'+GOALS[p.goal].prog+'» готов'),450)}

/* ---------- старт ---------- */
if(S.onb)showOnb();else $('#onb').classList.add('hide');
render();
</script>
</body>
</html>
