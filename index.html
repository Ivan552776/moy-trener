#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--sheet);box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -24px 60px rgba(0,0,0,.35);border-radius:30px 30px 0 0;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .42s var(--spring),visibility 0s .42s;z-index:11;display:flex;flex-direction:column}

#sheet .grab{height:22px;display:grid;place-items:center;flex:none} #sheet .grab::after{content:"";width:38px;height:5px;border-radius:9px;background:var(--text3);opacity:.5}

@media (prefers-color-scheme: dark){#veil{background:rgba(0,0,0,.55)} #toast{border:.5px solid var(--line)}}
.x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--text2);position:relative;transition:transform .15s var(--spring),background-color .15s} .x::before{content:"";position:absolute;inset:-8px} .x:active{transform:scale(.9);background:var(--line)}

#onb.hide{opacity:0;transform:scale(1.03);pointer-events:none}

.back{font-size:15px;font-weight:600;color:var(--text2);height:22px} .back span{padding:8px 10px;margin:-8px -10px;border-radius:10px} .back span:active{background:var(--card2)}

.opt .ibox{width:46px;height:46px;border-radius:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{background:var(--accent);color:#fff}
#onb .chip:not(.on),#onb .pill{background:var(--card);box-shadow:var(--shadow)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--pct,0%) 100% no-repeat var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);margin-top:-11px}
.lock{display:flex;gap:10px;align-items:flex-start;background:rgba(31,181,126,.1);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.4}

.toggle.on{background:var(--ok)} .toggle.on::after{transform:translateX(20px)}

.thumb{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none;position:relative;background:var(--card2)} .thumb i{position:absolute;inset:0;border-radius:inherit} .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;background:#2B2B33;color:#fff;box-shadow:var(--shadow);margin-bottom:12px;display:block}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.72))}

.hero>img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.5}
.hero.ph{background:#3A2A2A;box-shadow:0 18px 40px rgba(0,0,0,.25)} .hero.ph::before{background:linear-gradient(135deg,rgba(255,138,61,.55),rgba(255,45,120,.55))!important;inset:0;width:auto;height:auto;border-radius:0}

.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #FF4F45;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
.vid{aspect-ratio:16/10;border-radius:18px;background:linear-gradient(135deg,#2B2B33,#121216);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;transition:transform .2s var(--spring)} .vid:active{transform:scale(.985)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

function norm(pr){ // всё считает код, нейросеть цифры не придумывает
  const bmr=10*pr.w+6.25*pr.h-5*pr.age+(pr.sex==='m'?5:-161);
  const ws=WORK[pr.work][2],ts=pr.trains<=1?0:pr.trains<=3?1:2,grp=Math.min(ws+ts,4),kfa=KFA[grp];
  const tdee=bmr*kfa,g=GOALS[pr.goal],adj=g.adj[pr.pace];
  let kcal=Math.round(tdee*(1+adj)/10)*10;
  const floor=pr.sex==='m'?1500:1200,floored=kcal<floor;if(floored)kcal=floor;
  const p=Math.round(pr.w*g.prot),f=Math.round(kcal*.27/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));

(function(){
  const sh=$('#sheet'),veil=$('#veil'),body=$('#sbody');let y0=0,ly=0,lt=0,dy=0,vy=0,on=false;
  const start=y=>{y0=ly=y;dy=0;vy=0;lt=performance.now();on=true;sh.classList.add('drag');veil.classList.add('drag')};
  const move=y=>{if(!on)return;dy=Math.max(0,y-y0);const t=performance.now();vy=(y-ly)/Math.max(t-lt,1);ly=y;lt=t;sh.style.transform=`translateY(${dy}px)`;veil.style.opacity=Math.max(0,1-dy/sh.offsetHeight)};
  const end=()=>{if(!on)return;on=false;sh.classList.remove('drag');veil.classList.remove('drag');sh.style.transform='';veil.style.opacity='';if(dy>sh.offsetHeight*.28||vy>.7){haptic(6);closeSheet()}};
  ['.grab','.shead'].forEach(q=>{const el=sh.querySelector(q);
    el.addEventListener('pointerdown',e=>{if(e.target.closest('#sclose'))return;el.setPointerCapture(e.pointerId);start(e.clientY)});
    el.addEventListener('pointermove',e=>move(e.clientY));el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
  let tY=0,tOn=false,tDead=false;
  body.addEventListener('touchstart',e=>{tY=e.touches[0].clientY;tOn=false;tDead=body.scrollTop>0},{passive:true});
  body.addEventListener('touchmove',e=>{if(tDead)return;const y=e.touches[0].clientY;if(!tOn){if(y-tY>6&&body.scrollTop<=0){tOn=true;start(y)}else if(y-tY<-2){tDead=true;return}}if(tOn){e.preventDefault();move(y)}},{passive:false});
  body.addEventListener('touchend',()=>{if(tOn){tOn=false;end()}});body.addEventListener('touchcancel',()=>{if(tOn){tOn=false;end()}});
})();

function plateMini(d){return `<div class="thumb"><i style="background:conic-gradient(${d.tone[0]} 0 45%,${d.tone[1]} 45% 80%,${d.tone[2]} 80% 100%)"></i>${pic(d.img,d.name)}</div>`}

function gotPhoto(inp){

function clarify(){
  const d=SC.d;haptic(15);
  const parts=d.parts.map((pt,i)=>{
   const nu=partNutr(pt);
   const variants=pt.variants?`<div class="chips" style="margin:10px 0 4px">${pt.variants.map((v,j)=>`<button class="chip ${pt.v===j?'on':''}" onclick="setV(${i},${j})">${v.label}</button>`).join('')}</div>`:'';
   const amount=pt.count!=null
    ?`<div class="row between" style="margin-top:10px"><span class="muted small">Сколько штук</span><div class="ctl"><button class="rb" onclick="setCount(${i},-1)">−</button><span class="num" style="font-size:22px;min-width:22px;text-align:center">${pt.count}</span><button class="rb" onclick="setCount(${i},1)">+</button></div></div>
      <div class="muted small" style="margin-top:12px">Размер одной</div><div class="chips" style="margin-top:6px">${pt.perOpts.map(g=>`<button class="chip ${pt.per===g?'on':''}" onclick="setPer(${i},${g})">${g===70?'небольшая':g===90?'средняя':'крупная'} · ${g} г</button>`).join('')}</div>`
    :d.store?`<div class="chips" style="margin-top:10px">${[[d.pack,'всю упаковку'],[d.pack/2,'половину'],[Math.round(d.pack/4),'четверть']].map(([g,l])=>`<button class="chip ${pt.grams===g?'on':''}" onclick="setG(${i},${g})">${l} · ${g} г</button>`).join('')}</div>`
    :`<div class="row between" style="margin-top:8px"><span class="muted small">Граммы</span><span class="num" style="font-size:22px">${pt.grams} г</span></div>
      <input type="range" min="${pt.min}" max="${pt.max}" step="${pt.step}" value="${pt.grams}" oninput="setG(${i},+this.value,true)">
      <div class="chips">${pt.quick.map(g=>`<button class="chip ${pt.grams===g?'on':''}" onclick="setG(${i},${g})">${g===0?'не было':g+' г'}</button>`).join('')}</div>`;
   const tg=(pt.toggles||[]).map((t,j)=>`<div class="row between" style="margin-top:12px"><span style="font-size:15px">${t.label}?</span><button class="toggle ${t.on?'on':''}" onclick="setT(${i},${j})" aria-label="${t.label}"></button></div>`).join('');
   return `<div class="card"><div class="row between"><div class="title">${pt.name}${pt.variants?' — '+pt.variants[pt.v].label:''}</div><span class="num muted" style="font-size:15px">${fmt(nu.k)} ккал</span></div>${variants}${amount}${tg}</div>`;
  }).join('');
  const tot=total();
  sheet(d.name,`<div class="plate">${plateInner(d,u(tot.k,'ккал'))}</div>
   <div style="margin:12px 2px 8px"><span class="pill ${d.store?'ok':'accent'}">${d.store?'Нашли в базе: этикетка, 190 ккал / 100 г':'Нашли на тарелке: '+pl(d.parts.length,'часть','части','частей')}</span></div>
   <div class="small muted" style="margin:0 4px 10px">${d.store?'Состав и калории — с этикетки, которую мы сняли в магазине. Скажите, сколько съели.':'Состав каждой части берём из нашей базы. Уточните граммы — остальное посчитаем сами.'}</div>
   ${parts}<div class="cta"><button class="btn" onclick="result()">Готово · ${u(tot.k,'ккал')}</button></div>`);
}
function total(){return SC.d.parts.map(partNutr).reduce((t,x)=>({k:t.k+x.k,p:t.p+x.p,f:t.f+x.f,c:t.c+x.c,g:t.g+x.g}),{k:0,p:0,f:0,c:0,g:0})}
function keepScroll(fn){const y=$('#sbody').scrollTop;fn();$('#sbody').scrollTop=y}
function setV(i,j){SC.d.parts[i].v=j;haptic(6);keepScroll(clarify)}
function setCount(i,dlt){const pt=SC.d.parts[i];pt.count=Math.max(0,Math.min(6,pt.count+dlt));haptic(6);keepScroll(clarify)}
function setPer(i,g){SC.d.parts[i].per=g;haptic(6);keepScroll(clarify)}
function setT(i,j){const t=SC.d.parts[i].toggles[j];t.on=!t.on;haptic(6);keepScroll(clarify)}
function setG(i,g,live){SC.d.parts[i].grams=g;if(live){clearTimeout(setG.t);setG.t=setTimeout(()=>keepScroll(clarify),120)}else{haptic(6);keepScroll(clarify)}}

  const d=SC.d,t=total(),n=norm(S.profile),e=eaten(),after=n.kcal-e.k-t.k,acc=d.store?['высокая','данные с этикетки']:['средняя','состав из базы, граммы уточнены'];

    <div class="row" style="gap:10px;margin-top:16px">${[['Белки',t.p,'var(--p-text)'],['Жиры',t.f,'var(--f-text)'],['Углеводы',t.c,'var(--ok-text)']].map(([l,v,col])=>`<div style="flex:1;background:var(--card2);border-radius:14px;padding:10px"><div class="small muted">${l}</div><div class="num" style="font-size:20px;color:${col}">${fmt(v)} г</div></div>`).join('')}</div></div>

   <div class="card list">${d.parts.map(pt=>{const x=partNutr(pt);return x.g?`<div class="li"><div style="flex:1"><div style="font-weight:600">${pt.name}${pt.variants?' ('+pt.variants[pt.v].label+')':''}</div><div class="tiny muted">${x.items.filter(([,g])=>g>.5).map(([k,g])=>P[k].n.toLowerCase()+' '+fmt(g)+' г').join(' · ')}</div></div><div class="num">${fmt(x.k)}</div></div>`:''}).join('')}</div>
   <div class="card row"><div class="ibox" style="background:${after>=0?'rgba(31,181,126,.14)':'rgba(245,158,11,.16)'};color:${after>=0?'var(--ok)':'var(--warn)'}">${ic('today')}</div><div style="flex:1">${after>=0?`После этого блюда останется <b>${fmt(after)} ккал</b> на сегодня`:`Это блюдо выводит за норму на <b>${fmt(-after)} ккал</b>`}</div></div>
   <button class="btn" onclick="addLog()">Записать в дневник</button><button class="btn ghost" onclick="clarify()">Поправить граммы</button>`);

function formFile(inp){const f=inp.files&&inp.files[0];if(!f)return;formRun(URL.createObjectURL(f),FV.ex)}
const angle=(a,b,c)=>{const v1=[a.x-b.x,a.y-b.y],v2=[c.x-b.x,c.y-b.y];const d=v1[0]*v2[0]+v1[1]*v2[1],m=Math.hypot(...v1)*Math.hypot(...v2)||1;return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI};
const EDGES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
let POSE=null;
async function loadPose(){
  if(POSE)return POSE;
  const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const vision=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  POSE=await m.PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
  return POSE;
}

   <div class="card" style="margin-top:12px"><div class="row between"><span class="small muted" id="fstat">Загружаем модель…</span><span class="num" id="fpct">0%</span></div><div class="bar" style="margin-top:8px"><i id="fbar" style="width:0;background:var(--grad)"></i></div></div>`);
  const v=$('#fv'),c=$('#fc'),ctx=c.getContext('2d');
  try{
    const pl=await loadPose();v.src=src;await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=()=>j(new Error('видео не читается'));v.load()});
    c.width=v.videoWidth;c.height=v.videoHeight;const dur=Math.min(v.duration||0,20),step=1/10,S2=[];
    $('#fstat').textContent='Ищем суставы…';
    for(let t=0;t<dur;t+=step){v.currentTime=t;await new Promise(r=>{v.onseeked=r});const r=pl.detectForVideo(v,Math.round(t*1000));const lm=r.landmarks&&r.landmarks[0];
      if(lm)S2.push({t,lm:lm.map(p=>({x:p.x,y:p.y,v:p.visibility}))});
      const pct=Math.round(t/dur*100);$('#fpct').textContent=pct+'%';$('#fbar').style.width=pct+'%';

    if(S2.length<10)throw new Error('человек не найден в кадре — снимите целиком, сбоку, при хорошем свете');

}
function drawSkel(ctx,lm,W,H,col='#FF4F45'){ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,W/160);ctx.lineCap='round';EDGES.forEach(([a,b])=>{if(lm[a].v<.4||lm[b].v<.4)return;ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke()});ctx.fillStyle='#fff';lm.slice(11,29).forEach(p=>{if(p.v<.4)return;ctx.beginPath();ctx.arc(p.x*W,p.y*H,Math.max(3,W/120),0,7);ctx.fill()})}
function analyze(ex,S2){
  const kneeL=S2.map(s=>angle(s.lm[23],s.lm[25],s.lm[27])),kneeR=S2.map(s=>angle(s.lm[24],s.lm[26],s.lm[28]));
  const knee=kneeL.map((a,i)=>Math.min(a,kneeR[i])),hip=S2.map(s=>Math.min(angle(s.lm[11],s.lm[23],s.lm[25]),angle(s.lm[12],s.lm[24],s.lm[26])));
  const elbow=S2.map(s=>Math.min(angle(s.lm[11],s.lm[13],s.lm[15]),angle(s.lm[12],s.lm[14],s.lm[16])));
  const torso=S2.map(s=>{const sh={x:(s.lm[11].x+s.lm[12].x)/2,y:(s.lm[11].y+s.lm[12].y)/2},hp={x:(s.lm[23].x+s.lm[24].x)/2,y:(s.lm[23].y+s.lm[24].y)/2};return Math.abs(Math.atan2(sh.x-hp.x,hp.y-sh.y)*180/Math.PI)});
  const sig=ex==='pushup'?elbow:ex==='press'?elbow.map(a=>180-a):knee; // что считаем «движением»
  // повторы: минимумы сигнала ниже порога
  const reps=[];let inRep=false,start=0,minI=0;const hi=Math.max(...sig),lo=Math.min(...sig),thr=lo+(hi-lo)*.4;
  sig.forEach((a,i)=>{if(!inRep&&a<thr){inRep=true;start=i;minI=i}else if(inRep){if(a<sig[minI])minI=i;if(a>=thr+(hi-lo)*.2){reps.push({start,bottom:minI,end:i});inRep=false}}});
  const findings=[],good=[];let score=100;
  const bottoms=reps.map(r=>r.bottom);
  if(ex==='squat'||ex==='lunge'){
    const depth=bottoms.length?Math.min(...bottoms.map(i=>knee[i])):Math.min(...knee);
    if(depth>110){findings.push({k:'Недостаточная глубина',d:`В нижней точке угол в колене ${Math.round(depth)}°: бедро не доходит до параллели. Садитесь ниже, если позволяют колени.`,at:bottoms[0]});score-=25}else good.push('Глубина приседа достаточная');
    const lean=bottoms.length?Math.max(...bottoms.map(i=>torso[i])):Math.max(...torso);
    if(lean>45){findings.push({k:'Сильный наклон корпуса',d:`Корпус наклонён на ${Math.round(lean)}° в нижней точке — нагрузка уходит на поясницу. Держите грудь выше, вес на пятках.`,at:bottoms.find(i=>torso[i]>45)});score-=20}else good.push('Корпус держите ровно');
    const valgus=bottoms.filter(i=>{const l=S2[i].lm;const w=Math.abs(l[27].x-l[28].x)||.01;return Math.abs(l[25].x-l[26].x)<w*.75});
    if(valgus.length){findings.push({k:'Колени уходят внутрь',d:'В нижней точке колени ближе друг к другу, чем стопы. Разводите колени в стороны носков — так безопаснее для связок.',at:valgus[0]});score-=25}else good.push('Колени идут за носками');
    const asym=bottoms.length?Math.max(...bottoms.map(i=>Math.abs(kneeL[i]-kneeR[i]))):0;
    if(asym>15){findings.push({k:'Перекос на одну ногу',d:`Разница углов в коленях ${Math.round(asym)}°. Распределяйте вес на обе ноги поровну.`,at:bottoms[0]});score-=10}
  }
  if(ex==='pushup'){
    const depth=bottoms.length?Math.min(...bottoms.map(i=>elbow[i])):Math.min(...elbow);
    if(depth>100){findings.push({k:'Неполная амплитуда',d:`Локоть сгибается только до ${Math.round(depth)}°. Опускайтесь, пока грудь почти не коснётся пола.`,at:bottoms[0]});score-=25}else good.push('Амплитуда полная');
    const sag=Math.max(...S2.map(s=>Math.abs(angle(s.lm[11],s.lm[23],s.lm[25])-180)));
    if(sag>25){findings.push({k:'Провисает поясница',d:'Таз ниже линии плечи — пятки. Напрягите пресс и ягодицы, тело должно быть одной линией.',at:0});score-=20}else good.push('Тело держите одной линией');
  }
  if(ex==='plank'){
    const sag=S2.map(s=>Math.abs(angle(s.lm[11],s.lm[23],s.lm[25])-180)),worst=sag.indexOf(Math.max(...sag));
    if(sag[worst]>20){findings.push({k:'Таз провисает или задран',d:`Отклонение от прямой линии ${Math.round(sag[worst])}°. Подкрутите таз, напрягите пресс.`,at:worst});score-=30}else good.push('Линия тела прямая');
  }
  if(ex==='deadlift'){
    const lean=Math.max(...torso);if(lean<40){findings.push({k:'Мало наклона',d:'Таз почти не уходит назад — работают колени, а не задняя поверхность бедра. Наклоняйтесь глубже, отводя таз.',at:torso.indexOf(lean)});score-=20}else good.push('Таз уходит назад, наклон есть');
    const kneeMin=Math.min(...knee);if(kneeMin<100){findings.push({k:'Сильно сгибаете колени',d:`Колено сгибается до ${Math.round(kneeMin)}° — это присед, а не тяга. Колени чуть согнуты, движение в тазу.`,at:knee.indexOf(kneeMin)});score-=20}
  }
  if(ex==='press'){
    const lean=Math.max(...torso);if(lean>12){findings.push({k:'Прогиб в пояснице',d:`Корпус отклоняется на ${Math.round(lean)}°. Напрягите пресс, не подталкивайте гантели корпусом.`,at:torso.indexOf(lean)});score-=20}else good.push('Корпус стабилен');
    const top=Math.max(...elbow);if(top<160){findings.push({k:'Не дожимаете вверх',d:`Локоть распрямляется только до ${Math.round(top)}°. Выжимайте до полного выпрямления.`,at:elbow.indexOf(top)});score-=15}
  }
  if(!reps.length&&ex!=='plank'){findings.push({k:'Повторы не распознаны',d:'Не нашли ни одного полного движения: снимите сбоку, чтобы были видны колени и таз, 2–5 повторов.',at:0});score-=30}
  const tempo=reps.length?reps.map(r=>((r.end-r.start)*0.1).toFixed(1)):[];
  return {reps:reps.length,repList:reps,findings,good,score:Math.max(0,score),tempo,bottomIdx:bottoms[0]??Math.floor(S2.length/2),knee,hip,elbow,torso};
}

const MUSMAP={quads:['QUADRICEPS'],glutes:['GLUTEAL'],hams:['HAMSTRING'],core:['ABS','OBLIQUES','LOWER_BACK'],chest:['CHEST'],triceps:['TRICEPS'],shoulders:['FRONT_DELTOIDS','BACK_DELTOIDS'],back:['UPPER_BACK','TRAPEZIUS','LOWER_BACK'],calves:['CALVES','LEFT_SOLEUS','RIGHT_SOLEUS']};
function muscleMap(on){
  const act=new Set(on.flatMap(m=>MUSMAP[m]||[]));
  const side=(data,dx)=>data.map(([m,polys])=>polys.map(pts=>`<polygon points="${pts}" transform="translate(${dx},0)" class="${act.has(m)?'mon':(m==='HEAD'||m==='NECK'||m==='KNEES'?'skin':'')}"><title>${m}</title></polygon>`).join('')).join('');
  return `<svg viewBox="0 0 230 228" class="mmap" style="width:100%;max-height:270px;display:block"><defs><filter id="glow"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${side(MUS.front,5)}${side(MUS.back,125)}<text x="55" y="224" text-anchor="middle" class="lbl">спереди</text><text x="175" y="224" text-anchor="middle" class="lbl">сзади</text></svg>`;
}
function glowBody(ctx,lm,W,H,muscles){
  const P=i=>[lm[i].x*W,lm[i].y*H],seg=(a,b,w)=>{ctx.beginPath();ctx.moveTo(...P(a));ctx.lineTo(...P(b));ctx.lineWidth=w;ctx.stroke()},dot=(i,r)=>{ctx.beginPath();ctx.arc(...P(i),r,0,7);ctx.fill()},poly=ids=>{ctx.beginPath();ids.forEach((i,k)=>k?ctx.lineTo(...P(i)):ctx.moveTo(...P(i)));ctx.closePath();ctx.fill()};
  const u=W/10;ctx.save();ctx.filter=`blur(${Math.round(W/60)}px)`;ctx.strokeStyle='rgba(255,79,69,.55)';ctx.fillStyle='rgba(255,79,69,.5)';ctx.lineCap='round';
  muscles.forEach(m=>{if(m==='quads'||m==='hams'){seg(23,25,u*1.1);seg(24,26,u*1.1)}if(m==='glutes'){dot(23,u*.7);dot(24,u*.7)}if(m==='core'||m==='back'||m==='chest')poly([11,12,24,23]);if(m==='shoulders'){dot(11,u*.6);dot(12,u*.6)}if(m==='triceps'||m==='biceps'){seg(11,13,u*.7);seg(12,14,u*.7)}if(m==='calves'){seg(25,27,u*.7);seg(26,28,u*.7)}});
  ctx.restore();
}
function frameShot(v,lm,muscles,col,w=420){const c=document.createElement('canvas');const k=w/v.videoWidth;c.width=w;c.height=Math.round(v.videoHeight*k);const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);if(muscles)glowBody(ctx,lm,c.width,c.height,muscles);drawSkel(ctx,lm,c.width,c.height,col);return c.toDataURL('image/jpeg',.8)}
async function seekTo(v,t){v.currentTime=t;await new Promise(r=>{v.onseeked=r})}
function phaseFrames(a,S2){const r=a.repList&&a.repList[0];if(r)return{start:r.start,down:Math.round((r.start+r.bottom)/2),bottom:r.bottom,up:Math.round((r.bottom+r.end)/2)};const n=S2.length;return{start:0,down:Math.round(n*.3),bottom:Math.round(n*.5),up:Math.round(n*.75)}}
function phaseMetric(ex,a,i){const d=x=>Math.round(x)+'°';
  if(ex==='squat'||ex==='lunge')return{v:d(a.knee[i]),t:'цель ≤ 100°',ok:a.knee[i]<=100,n:'колено'};
  if(ex==='pushup')return{v:d(a.elbow[i]),t:'цель ≤ 90°',ok:a.elbow[i]<=90,n:'локоть'};
  if(ex==='plank'){const s=Math.abs(a.hip[i]-180);return{v:d(s),t:'цель ≤ 10°',ok:s<=10,n:'прогиб'}}
  if(ex==='deadlift')return{v:d(a.torso[i]),t:'цель 45–70°',ok:a.torso[i]>=45&&a.torso[i]<=70,n:'наклон'};
  if(ex==='press')return{v:d(a.elbow[i]),t:'цель ≥ 165°',ok:a.elbow[i]>=165,n:'локоть'};return null}
const PHASE_NAME={start:'Исходное',down:'Движение вниз',bottom:'Нижняя точка',up:'Подъём'};

   ${a.good.map(g=>`<div class="card row" style="padding:12px 16px"><span style="color:var(--ok-text)">${ic('check')}</span><div style="flex:1">${g}</div></div>`).join('')}

   <div class="li"><div style="width:52px"><div class="num">19:00</div><div class="tiny muted">сегодня</div></div><div style="flex:1"><div style="font-weight:600">Пилатес</div><div class="tiny muted">${S.wait?'вы 3-й в очереди · сообщим, если место освободится':'мест нет'}</div></div>${S.wait?'<span class="pill ok">в очереди</span>':'<button class="btn sec sm" onclick="S.wait=true;save();rerender();toast(\'Сообщим, если место освободится\')">В лист ожидания</button>'}</div>
   <div class="li"><div style="width:52px"><div class="num">20:00</div><div class="tiny muted">завтра</div></div><div style="flex:1"><div style="font-weight:600">Функциональный</div><div class="tiny muted">запись откроется завтра в 10:00</div></div>
    <button class="btn sm ${S.remind.func?'sec':''}" onclick="S.remind.func=!S.remind.func;save();rerender();toast(S.remind.func?'Напомним за 5 минут до открытия':'Напоминание выключено')">${ic('bell','style="width:18px;height:18px"')} ${S.remind.func?'Напомним':'Напомнить'}</button></div></div>
  <div class="small muted" style="margin:6px 4px">Запись, вход по QR и оплата остаются в приложении клуба — мы их не дублируем.</div>`;
}
function clubList(mode){
  const list=CLUBS.map(c=>({c,d:GEO?dist(GEO,c):null}));if(GEO)list.sort((a,b)=>a.d-b.d);
  const sel=mode==='onb'?D.club:S.profile.club;
  return list.map(({c,d})=>`<button class="opt ${sel===c.id?'on':''}" onclick="${mode==='onb'?`D.club='${c.id}';renderOnb()`:`pickClub('${c.id}')`}"><div class="ibox" style="background:var(--accent-soft);color:var(--accent)">${ic('club')}</div><div style="flex:1"><div style="font-weight:700">клуб «${c.n}»</div><div class="small muted">${c.m} · ${c.a.split(' · ')[0]}</div></div>${d!=null?`<span class="small muted">${kmTxt(d)}</span>`:''}</button>`).join('');
}
function openStreak(){sheet('Серия',`<div class="card"><div class="num" style="font-size:40px">3 недели</div><div class="muted">лучшая — 3 недели</div></div><div class="card list"><div class="li"><div style="flex:1">Правило</div><div class="muted" style="text-align:right">не меньше 2 тренировок в неделю — в зале или дома</div></div><div class="li"><div style="flex:1">Страховка</div><div class="muted">1 пропуск в месяц — осталась</div></div></div><button class="btn sec" onclick="closeSheet();toast('Пауза до понедельника — серия сохранена')">Пауза: болею / отпуск</button>`)}
function pickClub(id){S.profile.club=id;save();closeSheet();render();toast('Клуб: '+club().n)}
function openClubs(){sheet('Клубы сети',`<button class="btn sec" style="margin-bottom:12px" onclick="locate(n=>{if(n){pickClub(n.c.id)}else toast('Геопозиция недоступна — выберите вручную')})">${ic('pin')} Определить по геопозиции</button>${clubList('tab')}`)}

/* ---------- Чат ---------- */
function openChat(){
  sheet('Мой тренер',`<div id="chat"><div class="msg bot">Привет, ${S.profile.name}! Ваша цель — ${GOALS[S.profile.goal].n.toLowerCase()}. Помогу с тренировками и питанием. О чём спросить?</div></div>
   <div class="chips" style="margin-top:12px">${['Что съесть вечером?','Не успеваю сегодня в зал','Болит спина после тяги'].map(q=>`<button class="chip" onclick="ask(this.textContent)">${q}</button>`).join('')}</div>
   <div class="concept">Ответы в демо подготовлены заранее · не медицинская консультация</div>`);
}
function ask(q){
  const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="msg me">${q}</div>`);let a;
  if(q.startsWith('Что')){const s=suggest(),m=s.list[0];a=m?`Осталось ${fmt(s.remK)} ккал и ${fmt(s.remP)} г белка, бюджет ${fmt(s.budget)} ₽. Советую: <b>${m.n}</b> — ${fmt(m.nut.k)} ккал, белок ${fmt(m.nut.p)} г, около ${m.price} ₽. Купить можно в «${stores(budgetOf(S.profile))[0][0]}».`:'Норма на сегодня закрыта. Если голодно — стакан кефира.'}
  else if(q.startsWith('Не'))a='Ничего страшного. Предлагаю заменить на домашнюю на 20 минут — тренировка засчитается, программа сдвинется. Завтра в клубе «'+club().n+'» свободнее в '+bestHour()+':00.<div class="chips" style="margin-top:10px"><button class="chip on" onclick="closeSheet();openHome()">Заменить на домашнюю</button><button class="chip" onclick="toast(\'Оставили как есть\')">Оставить</button></div><div class="tiny muted" style="margin-top:8px">Изменения — только по вашей кнопке</div>';
  else a='С болью не тренируемся через силу. Уберите тягу на сегодня и покажите технику тренеру клуба. Если боль не проходит пару дней — к врачу.';
  setTimeout(()=>{c.insertAdjacentHTML('beforeend',`<div class="msg bot">${a}</div>`);haptic(8);$('#sbody').scrollTop=1e5},650);
}

/* ---------- План и источники ---------- */
const dec=v=>String(v).replace('.',',');
function calcCard(pr){
  const n=norm(pr),g=GOALS[pr.goal];
  return `<div class="card"><div class="calcrow"><span class="muted">Основной обмен (формула Миффлина — Сан Жеора)</span><span class="num">${fmt(n.bmr)}</span></div>
   <div class="calcrow"><span class="muted">× активность: группа ${ROMAN[n.grp]}, коэффициент ${dec(n.kfa)}</span><span class="num">${fmt(n.tdee)}</span></div>
   <div class="calcrow"><span class="muted">${n.adj?(n.adj<0?'−':'+')+Math.abs(Math.round(n.adj*100))+'% под цель «'+g.n.toLowerCase()+'»':'без поправки — держим вес'}</span><span class="num">${fmt(n.floored?Math.round(n.tdee*(1+n.adj)):n.kcal)}</span></div>
   ${n.floored?`<div class="calcrow"><span class="muted">Не опускаемся ниже безопасных ${n.floor} ккал</span><span class="num">${n.floor}</span></div>`:''}
   <div class="calcrow"><span class="muted">Белок: ${dec(g.prot)} г на кг веса</span><span class="num">${n.p} г</span></div>
   <div class="calcrow"><span class="muted">Жиры: 27% калорий</span><span class="num">${n.f} г</span></div>
   <div class="calcrow"><span class="muted">Углеводы: остальное</span><span class="num">${n.c} г</span></div></div>`;
}
const SOURCES=`<div class="card src"><div class="row" style="gap:8px;margin-bottom:6px;color:var(--text)">${ic('doc','style="width:18px;height:18px"')}<b>На чём основан расчёт</b></div>
 • МР 2.3.1.0253-21 Роспотребнадзора «Нормы физиологических потребностей в энергии и пищевых веществах» — группы физической активности.<br>
 • Формула Миффлина — Сан Жеора (1990) — основной обмен.<br>
 • Позиция Международного общества спортивного питания (ISSN) о белке, 2017 — 1,4–2,0 г/кг, при снижении веса выше.<br>
 • Совместная позиция ACSM, Академии питания и диетологии США и Dietitians of Canada, 2016 — жиры 20–35% калорий, углеводы по нагрузке.<br>
 • ВОЗ — не меньше 400 г овощей и фруктов в день.</div>`;
function openProfile(){
  const pr=S.profile;
  sheet('Мой план',`${calcCard(pr)}
   <div class="card list">${[['Цель',GOALS[pr.goal].n+' · '+PACE[pr.pace].toLowerCase()],['Рост и вес',pr.h+' см · '+pr.w+' кг'],['Работа',WORK[pr.work][0]+' · '+pl(pr.trains,'тренировка','тренировки','тренировок')+' в неделю'],['Бюджет на еду',fmt(budgetOf(pr))+' ₽ в день'],['Клуб','клуб «'+club().n+'»']].map(([a,b])=>`<div class="li"><div style="flex:1" class="muted">${a}</div><div style="font-weight:600;text-align:right">${b}</div></div>`).join('')}</div>
   <div class="lock" style="margin-bottom:12px">${ic('lock')}<div>Доход, вес и цели видите только вы. Клуб получает только обезличенную статистику.</div></div>
   ${SOURCES}<button class="btn sec" onclick="resetAll()">Пройти анкету заново</button>
   <div class="concept">Концепт приложения для фитнес-клубов · демо-данные · привязывается к вашим клубам и тренерам</div>`);
}
function resetAll(){try{localStorage.removeItem('yb-demo2')}catch(e){};S=fresh();closeSheet();showOnb()}

/* ---------- Анкета ---------- */
let OB=0,D={...DEMO},geoTried=false,obDir='',obPct=0;
const STEPS=7;
function showOnb(){OB=0;D={...DEMO};geoTried=false;obDir='';obPct=0;$('#onb').classList.remove('hide');renderOnb()}
function renderOnb(){
  const nr=norm(D),bud=budgetOf(D);
  const steps=[
   ()=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center">
      <div class="photo" style="aspect-ratio:16/11;margin:0 0 22px"> ${pic(gymPic('club'),'')}<div class="in" style="text-align:left"><div class="floaty" style="width:52px;height:52px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,79,69,.4)">${ic('spark','style="width:28px;height:28px"')}</div></div></div>
      <div class="q" style="font-size:36px">Мой тренер</div><div class="muted" style="font-size:18px;padding:0 8px;margin-top:6px">Персональный план тренировок и питания — под ваши цели, тело и бюджет. В каждом клубе вашей сети.</div>
      <div class="row" style="justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap">${['Норма по методике Роспотребнадзора','Калории по фото','Магазины рядом'].map(t=>`<span class="pill" style="background:var(--card);box-shadow:var(--shadow)">${t}</span>`).join('')}</div></div>
      <button class="btn" onclick="obNext()">Составить мой план</button><button class="btn ghost" onclick="obDemo()">Показать на примере</button>
      <div class="concept">Концепт для фитнес-клубов · демо-данные</div>`,
   ()=>`<div class="q">Чего хотите добиться?</div><div class="qs">План, калории и тренировки подстроятся под цель</div>
      <div style="overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">${Object.entries(GOALS).map(([k,g])=>`<button class="opt ${D.goal===k?'on':''}" onclick="D.goal='${k}';renderOnb()"><div class="ibox" style="background:${g.col}1f;color:${g.col}">${ic(g.i)}</div><div style="flex:1"><div style="font-weight:700">${g.n}</div><div class="small muted">${g.d}</div></div></button>`).join('')}
      ${D.goal==='lose'||D.goal==='muscle'?`<div class="small muted" style="margin:6px 4px 8px">Темп</div><div class="chips">${Object.entries(PACE).map(([k,l])=>`<button class="chip ${D.pace===k?'on':''}" onclick="D.pace='${k}';renderOnb()">${l} · ${(GOALS[D.goal].adj[k]>0?'+':GOALS[D.goal].adj[k]<0?'−':'')+Math.abs(Math.round(GOALS[D.goal].adj[k]*100))}%</button>`).join('')}</div>`:''}</div>
      <button class="btn" style="margin-top:12px" onclick="obNext()">Дальше</button>`,
   ()=>`<div class="q">Расскажите о себе</div><div class="qs">Нужно для точного расчёта нормы</div>
      <div class="small muted" style="margin:0 4px 6px">Пол</div><div class="chips" style="margin-bottom:12px">${[['m','Мужчина'],['f','Женщина']].map(([k,l])=>`<button class="chip ${D.sex===k?'on':''}" onclick="D.sex='${k}';renderOnb()">${l}</button>`).join('')}</div>
      <div class="small muted" style="margin:0 4px 6px">Опыт тренировок</div><div class="chips" style="margin-bottom:12px">${[['new','Новичок'],['mid','До года'],['pro','Больше года']].map(([k,l])=>`<button class="chip ${D.level===k?'on':''}" onclick="D.level='${k}';renderOnb()">${l}</button>`).join('')}</div>
      ${[['age','Возраст','лет',1,14,80],['h','Рост','см',1,140,210],['w','Вес','кг',1,40,180]].map(([k,l,u,st,mn,mx])=>`<div class="stepper"><div><div style="font-weight:650">${l}</div><div class="small muted">${u}</div></div><div class="ctl"><button class="rb" onclick="obAdj('${k}',-${st},${mn},${mx})">−</button><span class="num" style="font-size:24px;min-width:52px;text-align:center">${D[k]}</span><button class="rb" onclick="obAdj('${k}',${st},${mn},${mx})">+</button></div></div>`).join('')}
      <div class="small muted" style="margin:2px 4px 0">Мы не спрашиваем о болезнях. При травмах и заболеваниях посоветуйтесь с врачом или тренером клуба.</div>
      <div style="flex:1"></div><button class="btn" onclick="obNext()">Дальше</button>`,
   ()=>`<div class="q">Насколько вы активны?</div><div class="qs">Группа активности по нормам Роспотребнадзора</div>
      ${Object.entries(WORK).map(([k,w])=>`<button class="opt ${D.work===k?'on':''}" onclick="D.work='${k}';renderOnb()"><div class="ibox" style="background:var(--card2);color:var(--text)">${ic(w[3])}</div><div style="flex:1"><div style="font-weight:700">${w[0]}</div><div class="small muted">${w[1]}</div></div></button>`).join('')}
      <div class="small muted" style="margin:8px 4px">Тренировок в неделю</div><div class="chips">${[2,3,4,5].map(t=>`<button class="chip ${D.trains===t?'on':''}" onclick="D.trains=${t};renderOnb()">${t}</button>`).join('')}</div>
      <div style="flex:1"></div><div class="card row" style="margin:12px 0 10px"><div style="flex:1" class="small muted">Группа активности ${ROMAN[nr.grp]} · коэффициент</div><div class="num" style="font-size:22px">${dec(nr.kfa)}</div></div>
      <button class="btn" onclick="obNext()">Дальше</button>`,
   ()=>`<div class="q">Бюджет на питание</div><div class="qs">Подберём меню и магазины, которые вам по карману</div>
      <div style="overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">
      <div class="lock" style="margin-bottom:12px">${ic('lock')}<div><b>Конфиденциально.</b> Доход видите только вы — он хранится на вашем телефоне и не передаётся клубу.</div></div>
      <div class="card"><div class="small muted">Доход в месяц</div><div class="num" style="font-size:34px" id="incv">${fmt(D.income)} ₽</div>
       <input type="range" min="20000" max="500000" step="5000" value="${D.income}" oninput="D.income=+this.value;updBud()">
       <div class="row between" style="margin-top:8px"><span class="small muted">Сколько человек кормит этот доход</span><div class="ctl"><button class="rb" onclick="obAdj('people',-1,1,6)">−</button><span class="num" style="font-size:20px;min-width:20px;text-align:center">${D.people}</span><button class="rb" onclick="obAdj('people',1,1,6)">+</button></div></div>
       <div class="small muted" style="margin-top:12px">Доля на еду (в среднем по России — около трети расходов)</div>
       <div class="chips" style="margin-top:6px">${[[.2,'20%'],[.3,'30%'],[.4,'40%']].map(([v,l])=>`<button class="chip ${D.share===v?'on':''}" onclick="D.share=${v};renderOnb()">${l}</button>`).join('')}</div></div>
      <div class="card row"><div class="ibox" style="background:rgba(31,181,126,.14);color:var(--ok)">${ic('wallet')}</div><div style="flex:1"><div class="small muted">Бюджет на еду</div><div class="num" style="font-size:26px" id="budv">${fmt(bud)} ₽ в день</div><div class="small muted" id="stv">${stores(bud).map(s=>s[0]).join(', ')}</div></div></div></div>
      <button class="btn" style="margin-top:12px" onclick="obNext()">Дальше</button>`,
   ()=>{if(!geoTried){geoTried=true;locate(n=>{if(n){D.club=n.c.id;D._geo=kmTxt(n.d)}else D._geo=false;if(OB===5)renderOnb()})}
      const c=CLUBS.find(x=>x.id===D.club);
      return `<div class="q">Ваш клуб</div><div class="qs">${D._geo?'Определили по геопозиции — ближайший к вам':D._geo===false?'Геопозиция недоступна — выберите клуб':'Ищем ближайший клуб…'}</div>
      ${D._geo?`<div class="card row" style="border:2px solid var(--accent)"><div class="ibox" style="background:var(--grad);color:#fff">${ic('pin')}</div><div style="flex:1"><div class="title">клуб «${c.n}»</div><div class="small muted">${D._geo} от вас · ${c.m}</div></div></div>`:''}
      <div style="overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">${clubList('onb')}</div>
      <button class="btn" style="margin-top:12px" onclick="obNext()">Дальше</button>`},
   ()=>`<div class="q">Ваш план готов</div><div class="qs">Посчитано по вашим данным — формулами, а не нейросетью</div>
      <div style="overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px">
      <div class="hero" style="text-align:center"><div style="font-size:13px;opacity:.9">Суточная норма</div><div class="num" style="font-size:52px;line-height:1.05">${CU(nr.kcal)}</div><div style="font-size:14px;opacity:.9">ккал · Б ${nr.p} · Ж ${nr.f} · У ${nr.c}</div></div>
      ${calcCard(D)}
      <div class="grid2" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="small muted">Еда в день</div><div class="num" style="font-size:24px">${fmt(bud)} ₽</div><div class="small muted">${stores(bud).map(s=>s[0]).slice(0,2).join(', ')}</div></div>
       <div class="card" style="margin:0"><div class="small muted">Программа</div><div class="num" style="font-size:19px">${GOALS[D.goal].prog}</div><div class="small muted">${pl(D.trains,'раз','раза','раз')} в неделю · клуб «${CLUBS.find(x=>x.id===D.club).n}»</div></div></div>
      ${SOURCES}</div>
      <button class="btn" style="margin-top:12px" onclick="obFinish()">Начать</button>`
  ];
  const pct=OB/(STEPS-1)*100;
  $('#onb').innerHTML=`<div class="back row between">${OB>0?`<span onclick="obBack()" style="cursor:pointer">‹ Назад</span><span class="tiny muted">${OB} из ${STEPS-1}</span>`:''}</div>${OB>0?`<div class="prog"><i style="width:${obDir?obPct:pct}%" data-w="${pct}%"></i></div>`:''}<div class="${obDir?'stg '+obDir:''}" style="flex:1;display:flex;flex-direction:column;min-height:0">${steps[OB]()}</div>`;
  after($('#onb'),!!obDir&&!RM,true);obDir='';obPct=pct;
}
function updBud(){const b=budgetOf(D);const a=$('#incv'),bv=$('#budv'),sv=$('#stv');if(a)a.textContent=fmt(D.income)+' ₽';if(bv)bv.textContent=fmt(b)+' ₽ в день';if(sv)sv.textContent=stores(b).map(s=>s[0]).join(', ')}
function obAdj(k,d,mn,mx){D[k]=Math.max(mn,Math.min(mx,D[k]+d));haptic(4);renderOnb()}
function obNext(){obDir='sl';OB=Math.min(OB+1,STEPS-1);haptic(8);renderOnb()}
function obBack(){obDir='sr';OB=Math.max(0,OB-1);haptic(5);renderOnb()}
function obDemo(){D={...DEMO};obFinish()}
function obFinish(){const p={...D};delete p._geo;S.profile=p;S.onb=false;S.done=[0];S.sets={};S.log=[];seedDay();save();$('#onb').classList.add('hide');haptic([10,40,10]);DIR='';render();toTop();setTimeout(()=>{toast('План «'+GOALS[p.goal].prog+'» готов');confetti(100,.5,.3)},450)}

/* ---------- старт ---------- */
if(S.onb)showOnb();else $('#onb').classList.add('hide');
render();
</script>
